s. Un seul trône.","ov":"À une époque où les monstres parcourent la Terre, et alors que l’humanité lutte pour son avenir, Godzilla et King Kong, les deux forces les plus puissantes de la nature, entrent en collision dans une bataille spectaculaire inédite. Alors que Monarch se lance dans une mission périlleuse en terrain inconnu, et qu’il découvre des indices sur les origines des Titans, un complot humain menace d’éradiquer ces créatures – qu’elles soient bonnes ou mauvaises – de la surface de la planète.","po":"/4bTShLVFnVKK31cowgjdAIZV84T.jpg"},{"m":"movie","i":400928,"t":"Mary","y":"2017","g":[18,35],"k":[1437,2182,920,3226,3227,3228,88,3182,3229,1206,1209],"cr":[87742],"ca":[16828,1172108,30083,213001,6944],"rc":[1340206],"p":"p4","bz":0.4984924623115578,"q":0.7487437185929648,"n":6094,"v":7.987,"rt":101,"se":null,"tg":"Le génie n'attend pas l'âge adulte.","ov":"Un homme se bat pour obtenir la garde de sa nièce, qui témoigne d'un don hors du commun pour les mathématiques.","po":"/wHyrEoiAjFQ6HigTSgoI20CrlTc.jpg"},{"m":"movie","i":406997,"t":"Wonder","y":"2017","g":[10751,18],"k":[1683,18,1197,3230,3231,140,1508,3232,3233,3234,1206,3235],"cr":[19311],"ca":[1277188,1204,887,1109976,1590759],"rc":[],"p":"p4","bz":0.5919597989949749,"q":0.8592964824120602,"n":8427,"v":8.1,"rt":113,"se":null,"tg":"Êtes-vous prêts à rencontrer Auggie Pullman ?","ov":"L'histoire de August Pullman, un petit garçon né avec une malformation du visage qui l'a empêché jusqu'à présent d'aller normalement à l'école. Aujourd'hui, il rentre en CM2 à l'école de son quartier. C'est le début d'une aventure humaine hors du commun. Chacun, dans sa famille, parmi ses nouveaux camarades de classe, et dans la ville toute entière, va être confronté à ses propres limites, à sa générosité de coeur ou à son étroitesse d'esprit. L'aventure d'Auggie finira par unir les gens autour de lui.","po":"/cTxheJP4o1hMw6cQ2TXVnrcPhmT.jpg"},{"m":"movie","i":411088,"t":"L'Accusé","y":"2017","g":[18,9648,53],"k":[3236,32 ar l'abus de pouvoir et la corruption.","po":"/t9JGg10CW1DzXEdWL54ewkUko6N.jpg"},{"m":"movie","i":419430,"t":"Get Out","y":"2017","g":[9648,53,27],"k":[3252,35,829,3253,3254,3255,46,1240,806,3256,3257,98,3258,2568,3259,369,37,2108],"cr":[291263],"ca":[206919,1255540,2229,11367,572541],"rc":[],"p":"p4","bz":0.6180904522613065,"q":0.3065326633165829,"n":19448,"v":7.625,"rt":104,"se":null,"tg":"Ce n'est pas parce que vous êtes invité que vous êtes le bienvenu.","ov":"Couple mixte, Chris et sa petite amie Rose filent le parfait amour. Le moment est donc venu de rencontrer la belle famille, Missy et Dean lors d'un week‑end sur leur domaine dans le nord de l'État. Chris commence par penser que l'atmosphère tendue est liée à leur différence de couleur de peau, mais très vite une série d'incidents de plus en plus inquiétants lui permet de découvrir l'inimaginable.","po":"/8WzjAhgc4HvpN3Y6LLCc6AbpIhF.jpg"},{"m":"movie","i":419478,"t":"Midnight Sun","y":"2018","g":[10749,18],"k":[3260,190,3261,3262,3263,3098,3264,1663,3265,3266,3267,529,3268,3269,3270,1144,2939],"cr":[932088],"ca":[98285,1053422,71403,429728,158396],"rc":[527641],"p":"p4","bz":0.29246231155778896,"q":0.5678391959798995,"n":3579,"v":7.8,"rt":92,"se":null,"tg":"L'amour éclairera ton chemin.","ov":"Katie Price est une jolie jeune fille de 17 ans, intelligente et douée pour le chant et la guitare. Elle est atteinte d’une maladie rare qui lui interdit d’être touchée par le moindre UV. Déterminée à ne pas être vaincue par sa maladie, Katie profite de la nuit pour sortir et jouer de sa musique dans une station de train local. D’une rencontre fortuite avec Charlie Reed va naître un long été idyllique…","po":"/1TH4PwfcRPenIxce3BREDIV4mBd.jpg"},{"m":"movie","i":424694,"t":"Bohemian Rhapsody","y":"2018","g":[10402,18],"k":[297,517,2717,8,278,1082,2285,1064,2719,153,976,1538,497,1540,529],"cr":[9032],"ca":[17838,1220123,1452045,4787,86232],"rc":[205596],"p":"p4","bz":0.742713567839196,"q":0.7638190954773869,"n":18114,"v" 05527638190955,"q":0.7738693467336684,"n":6352,"v":8.0,"rt":109,"se":null,"tg":"On mérite tous une première grande histoire d'amour.","ov":"On mérite tous une première grande histoire d’amour. Pourtant pour le jeune Simon, c’est compliqué. Il a une vie normale, dans une famille qu’il adore, et est entouré d’amis extraordinaires, mais il garde pour lui un grand secret : personne ne sait qu’il est gay et il ne connaît pas l’identité de son premier coup de cœur, avec qui il communique en ligne. Alors que son secret est menacé d’être révélé, la vie de Simon bascule dans une aventure aussi drôle que bouleversante… Ses amis prendront alors une place essentielle pour l’aider à changer sa vie et découvrir le premier amour.","po":"/qnA8dIE9yrI4KGO9qgemu79YBCR.jpg"},{"m":"movie","i":466282,"t":"À tous les garçons que j'ai aimés","y":"2018","g":[35,10749],"k":[3304,18,908,2995,1173,240,3305,3306,24,2406,338,1017,228,846],"cr":[72036],"ca":[1452046,1253353,969140,93377,1683266],"rc":[583083],"p":"p4","bz":0.33668341708542715,"q":0.27638190954773867,"n":8790,"v":7.589,"rt":100,"se":null,"tg":"Et si vos amours secrets découvraient la véritable nature de vos sentiments… tous en même temps ?","ov":"La vie sentimentale de Lara Jean Song Covey passe du rêve à la pire des réalités quand ses lettres d'amour aux cinq garçons qu'elle a toujours aimés arrivent mystérieusement chez leurs destinataires.","po":"/iHHnZDfCA5bSi3eotUmVPlQkzov.jpg"},{"m":"movie","i":475557,"t":"Joker","y":"2019","g":[80,53,18],"k":[517,2416,3307,419,2813,2403,3308,3309,1615,352,2388,3310,3311,98,39,3312,3313,1056],"cr":[57130],"ca":[73421,380,1545693,4432,16841],"rc":[],"p":"p4","bz":0.9105527638190954,"q":0.9195979899497487,"n":28466,"v":8.114,"rt":122,"se":null,"tg":"Préparez votre plus beau sourire.","ov":"Dans les années 1980, à Gotham City, Arthur Fleck, un humoriste de stand‐up raté, bascule dans la folie et devient le Joker.","po":"/tWjJ3ILjsbTwKgXxEv48QAbYZ19.jpg"},{"m":"movie","i":481848,"t":"L'appel de la forêt","y":"2020","g":[12,10751,18],"k":[308,234,72,1058,18,74,3314,3315,3186,3316,3317],"cr":[66193],"ca":[3,221018,1660946,543261,78423],"rc":[381289],"p":"p4","bz":0.21005025125628143,"q":0.21105527638190955,"n":4026,"v":7.504,"rt":100,"se":null,"tg":"Trouvez le courage de suivre votre instinct.","ov":"Alliant prises de vues réelles et animation, L'Appel de la forêt raconte l’histoire de Buck, un chien au grand cœur, dont la paisible vie domestique bascule lorsqu’il est brusquement arraché de sa maison en Californie et se retrouve enrôlé comme chien de traîneau dans les étendues sauvages du Yukon en Alaska, pendant la ruée vers l’or, dans les années 1890. Buck va devoir s’adapter et lutter pour survivre, jusqu’à finalement vivre l’aventure de sa vie et trouver sa véritable place dans le monde en devenant son propre maître…","po":"/gNrZ3LYexKfoH63Y4rYNdhwyLsW.jpg"},{"m":"movie","i":487558,"t":"BlacKkKlansman : J'ai infiltré le Ku Klux Klan","y":"2018","g":[80,35,18,36],"k":[297,2574,18,8,278,3318,391,3319,2564,2568,3320,70,3321,2570],"cr":[5281],"ca":[1117313,1023139,17052,1606394,7447],"rc":[556984],"p":"p4","bz":0.23819095477386934,"q":0.06532663316582915,"n":8304,"v":7.486,"rt":128,"se":null,"tg":"Infiltrer la haine.","ov":"Au début des années 70, au plus fort de la lutte pour les droits civiques, plusieurs émeutes raciales éclatent dans les grandes villes des États-Unis. Ron Stallworth devient le premier officier Noir américain du Colorado Springs Police Department, mais son arrivée est accueillie avec scepticisme, voire avec une franche hostilité, par les agents les moins gradés du commissariat. Prenant son courage à deux mains, Stallworth va tenter de faire bouger les lignes et, peut-être, de laisser une trace dans l'histoire. Il se fixe alors une mission des plus périlleuses : infiltrer le Ku Klux Klan pour en dénoncer les exactions.","po":"/z8vDfDI7SOVasPlqUT38Pm0wyEZ.jpg"},{"m":"movie","i":489999,"t":"Searching : Portée disparue","y":"2018","g":[18,9648,53],"k":[3304,312,3322,829,2235,2751,87,169,3323,260,2229,3324,3325,2356,1171,806,710,1862,1933,90,940],"cr":[1932296],"ca":[68842,1993734,23959,2125528,1440699],"rc":[1236153],"p":"p4","bz":0.24020100502512565,"q":0.31155778894472363,"n":4396,"v":7.565,"rt":102,"se":null,"tg":"Pour retrouver sa fille, il devra d'abord comprendre qui elle est.","ov":"Alors que Margot, 16 ans, a disparu, l’enquête ouverte ne donne rien et malgré les heures décisives qui s’écoulent, l’inspectrice chargée de l’affaire n’a pas le moindre indice. Le père, David, décide alors de mener ses propres recherches, en commençant par là où personne n’a encore regardé : l’ordinateur de sa fille. Dans un thriller hyper moderne tourné uniquement à travers des appareils technologiques que l'on utilise quotidiennement pour communiquer, David doit impérativement retrouver la trace de sa fille avant qu'elle ne disparaisse pour toujours.","po":"/hsXFadgegUygPqMrW8McvmNWGpX.jpg"},{"m":"movie","i":490132,"t":"Green Book : Sur les routes du Sud","y":"2018","g":[18,35,36],"k":[516,8,3326,1712,31,1064,153,1539,932,2568,3327,469,3328,3329],"cr":[7396],"ca":[110,932967,1817,299743,1613744],"rc":[1299655],"p":"p4","bz":0.7969849246231157,"q":0.9346733668341709,"n":13340,"v":8.224,"rt":130,"se":null,"tg":"Inspiré par la vraie amitié…","ov":"En 1962, alors que règne la ségrégation, Tony Lip, un videur italo-américain du Bronx, est engagé pour conduire et protéger le Dr Don Shirley, un pianiste noir de renommée mondiale, lors d’une tournée de concerts. Durant leur périple de Manhattan jusqu’au Sud profond, ils s’appuient sur le Green Book pour dénicher les établissements accueillant les personnes de couleur, où l’on ne refusera pas de servir Shirley et où il ne sera ni humilié ni maltraité. Dans un pays où le mouvement des droits civiques commence à se faire entendre, les deux hommes vont être confrontés au pire de l’âme humaine, dont ils se guérissent grâce à leur générosité et leur humour. Ensemble, ils vont d té de fer.","po":"/2Sc0veFPh9CcHMtNqMyiQqIW9ZF.jpg"},{"m":"tv","i":45871,"t":"Vis a Vis : El Oasis","y":"2020","g":[18],"k":[328],"cr":[1255408],"ca":[1075560,16442,1464946,953810,144213],"rc":[74428,259702],"p":"p4","bz":0.2190954773869347,"q":0.17587939698492464,"n":2018,"v":7.8,"rt":50,"se":1,"tg":"Vis a vis: L'oasis","ov":"Vis a Vis: L'Oasis se concentre sur les personnages de Zulema et Maca de Vis a Vis. Macarena est une femme arrêtée à la prison de Cruz del Sur pour fraude et blanchiment d'argent pour l'entreprise où elle travaillait, trompée par son ancien patron et amant. Accusée de cinq délits fiscaux, elle doit rester en prison en attendant son procès. Zulema Zahir est une stagiaire très manipulatrice et dangereuse de Cruz del Sur, prête à tout pour se sauver. Après leur libération de prison, les protagonistes formeront un excellent duo de voleurs à l'étranger.","po":"/7EOWkNGxXq2MBZxfV3ZxjRM4vlH.jpg"},{"m":"tv","i":45950,"t":"High School DxD","y":"2012","g":[16,10759,35,10765],"k":[3749,443,1101,136,1271,2446,3750,1415,240,1736,3751,654,338,3752,1207,3753,476,105,1372,3754,3355,1517,2331],"cr":[],"ca":[149894,1072774,1325958,571993,1072776],"rc":[],"p":"p4","bz":0.6301507537688442,"q":0.8090452261306532,"n":2076,"v":8.5,"rt":null,"se":4,"tg":null,"ov":"Issei Hyôdô est un lycéen inscrit à l'académie Kuô, un établissement qui n'accueillait que des filles jusqu'à récemment. Bien que la gent féminine constitue l'écrasante majorité de ce lieu d'études, Issei se désespère de n'avoir toujours pas de petite amie. C’est alors qu'il fait la connaissance de Yûma, qui va lui demander de sortir avec lui...","po":"/yMYvz4vbKMIXb2IMYYi1GSlNaGx.jpg"},{"m":"tv","i":46648,"t":"True Detective","y":"2014","g":[18,9648],"k":[177,1268,417,795,2303,826,395,1095,176,2694,3113,2372,3002,779,1862,3693,488],"cr":[1281190,964037],"ca":[1038,3119545,10981,1512452,3161757],"rc":[60622,39351],"p":"p4","bz":0.714572864321608,"q":0.6683417085427136,"n":4411,"v":8.291,"rt":null,"se":4,"tg":"Touchez l'obscurité et l'obscurité vous touche en retour.","ov":"Série d'anthologie dans laquelle les enquêtes policières mettent au jour les secrets personnels et professionnels des personnes impliquées, tant à l'intérieur qu'à l'extérieur de la loi.","po":"/v1pOP44wChdvxoGhnjSmhnzyDje.jpg"},{"m":"tv","i":46786,"t":"Bates Motel","y":"2013","g":[18,80,9648],"k":[329,313,3755,1097,865,488,183,740],"cr":[161839,1236253,983265],"ca":[21657,1281,41883,1173984,21316],"rc":[241372,244244,194764,108181],"p":"p4","bz":0.3587939698492463,"q":0.32914572864321606,"n":1836,"v":8.0,"rt":45,"se":5,"tg":null,"ov":"Après la mort mystérieuse de son mari, Norma Bates décide de refaire sa vie loin de l'Arizona, dans la petite ville de White Pine Bay dans l'Oregon, et emmène avec elle son fils Norman, âgé de 17 ans. Elle rachète là-bas un vieux motel abandonné depuis de nombreuses années, ainsi que le manoir qui trône majestueusement quelques mètres plus loin. La mère et le fils partagent depuis toujours une relation complexe, presque incestueuse. Des événements tragiques vont les pousser à se rapprocher encore davantage. Ils partagent désormais ensemble un lourd secret…","po":"/xXKcfZE7ulYxgjjYv51s0zDG69s.jpg"},{"m":"tv","i":46896,"t":"The Originals","y":"2013","g":[10765,18,9648],"k":[3756,380,400,328,449,1549,382],"cr":[],"ca":[79505,19154,1257816,1058848,2253],"rc":[86423,79242,79460],"p":"p4","bz":0.7839195979899498,"q":0.9396984924623115,"n":3666,"v":8.6,"rt":45,"se":5,"tg":null,"ov":"Le vampire originel Klaus fait son retour au Vieux Carré, un quartier français de la Nouvelle Orléans. Dans cette ville qu’il a aidé à construire quelques siècles plus tôt, il y retrouve son ancien protégé, le diabolique et charismatique Marcel. Dans l’espoir d’aider son jeune frère à trouver la rédemption, Elijah est contraint de s’allier avec des ennemis de Marcel...","po":"/keJOhJXGiLL54EW6QocbyvQGquA.jpg"},{"m":"tv","i":46952,"t":"Blacklist","y":"2013","g":[18,80,9648],"k":[3757,3713,3308,216,2449,826,218],"cr":[52001],"ca":[13548,142193,144583,2622043,9464],"rc":[287238,40008],"p":"p4","bz":0.48542713567839196,"q":0.005025125628140704,"n":3740,"v":7.632,"rt":null,"se":10,"tg":null,"ov":"Raymond « Red » Reddington, l’un des fugitifs les plus recherchés par le FBI, se rend en personne au quartier général du FBI à Washington. Il affirme avoir les mêmes intérêts que le FBI : faire tomber des criminels dangereux et des terroristes. Reddington coopérera, mais insiste pour ne parler qu’à Elizabeth Keen, une profileuse inexpérimentée du FBI. Keen s’interroge sur l’intérêt soudain que Reddington lui porte, bien qu’il soutienne que Keen est très spéciale. Après que le FBI a fait tomber un terroriste sur lequel il a fourni des informations, Reddington révèle que ce terroriste n’est que le premier de beaucoup d’autres à venir : durant les deux dernières décennies, il a fait une liste des criminels et terroristes qu'il croit introuvable par le FBI parce que ce dernier ignorait leur existence et que ce sont les plus importants. Reddington l’appelle « La Liste noire » (« The Blacklist »).","po":"/dIR6njcRuUtX3ShXECil3a2W5U7.jpg"},{"m":"tv","i":47665,"t":"Black Sails","y":"2014","g":[18,10759],"k":[3758,1635,335,316,421,3759,424,3760],"cr":[1215827,1215822],"ca":[10881,135483,1258225,211540,77721],"rc":[271855,63333],"p":"p4","bz":0.12261306532663319,"q":0.08040201005025126,"n":1532,"v":7.636,"rt":60,"se":4,"tg":"Prends ce qui t'appartient","ov":"1715, l'âge d'or de la piraterie dans les Caraïbes. L'ancienne colonie britannique de New Providence est contrôlée par les pirates. Parmi eux, le plus célèbre et le plus craint est le Capitaine Flint. Lorsque la flotte britannique décide de reconquérir ce territoire abandonné aux mains des hors-la-loi, Flint décide de lutter. Car le retour de l'Empire Britannique signifierait l'extinction des pirates. Allié à Eleanor Guthrie, dont le père règne sur la contrebande à New Providence, il met au point un plan pour sauver les pirat : Une odyssée à travers l'univers » nous y emmène.","po":"/aBfrU3NiTk2VSUw0QKmyoP2tIFy.jpg"},{"m":"tv","i":58841,"t":"Chicago Police Department","y":"2014","g":[80,18],"k":[323,1528,995,328],"cr":[117443,1214477],"ca":[37203,1100549,115730,1848255,1521411],"rc":[273207,44006,257534],"p":"p4","bz":0.685427135678392,"q":0.7386934673366834,"n":2641,"v":8.4,"rt":null,"se":14,"tg":null,"ov":"Des officiers en uniforme qui patrouillent et combattent le crime dans la rue, aux membres de l'unité des renseignements affectés à des affaires majeures (crime organisé, trafic de drogue, homicides...), toutes les recrues du poste de police du district 21 de Chicago risquent quotidiennement leurs vies. Ces énormes responsabilités dépassent souvent le simple cadre professionnel et entâchent la sphère privée de ces hommes et de ces femmes d'exception.\n\nSpin-off de Chicago Fire centré sur une brigade de police de la ville.","po":"/sfBiloE6J9rFEnpvckdeHZ06SSl.jpg"},{"m":"tv","i":60059,"t":"Better Call Saul","y":"2015","g":[80,18],"k":[504,2312,3790,2784,3562,35,1231,302,3203,2336,61,686,88,3791,3632,2694,2859,2320,3792,865,338,328,2173],"cr":[66633,24951],"ca":[59410,783,62765,76855,4808],"rc":[86430,194764],"p":"p4","bz":0.9125628140703519,"q":0.9849246231155779,"n":6959,"v":8.716,"rt":null,"se":6,"tg":"Mettre le \"criminel\" dans \"avocat pénaliste\".","ov":"Six ans avant de croiser le chemin de Walter White, Saul Goodman, connu sous le nom de Jimmy McGill, est un avocat qui peine à joindre les deux bouts, à Albuquerque, au Nouveau-Mexique. Pour boucler ses fins de mois, il n'aura d'autres choix que se livrer à quelques petites escroqueries. Chemin faisant, il va faire des rencontres qui vont se révéler déterminantes dans son parcours : Nacho Varga, ou encore Mike Ehrmantraut, un criminel spécialisé dans le \"nettoyage\", qui deviendra son futur homme de main.","po":"/7KyuCBjxsr4sNQga16DcN9ccEyf.jpg"},{"m":"tv","i":60573,"t":"Silicon Valley","y":"2014","g":[35],"k":[2724,3793,3794,3       let squares = 0;

      item.vec = vec;

    const familiesById = new Map();

        }
        // Même ordre que Python : score décroissant, puis titre décroissant.
        sims.sort((a, b) => (b[0] - a[0]) || (a[1] < b[1] ? 1 : a[1] > b[1] ? -1 : 0));
        const top = sims.slice(0, 3).map(pair => pair[0]);
        while (top.length < 3) top.push(0);
        const favPos = Math.min(1, top[0] + 0.5 * top[1] + 0.25 * top[2]);
        let favNeg = 0;
        for (const [fav, strength] of disliked) {
          favNeg = Math.max(favNeg, Math.min(1, cosine(item, fav) * cfg.simScale) * strength);
        }
        const favScore = favPos - favNeg;

        const parts = {
          taste: tasteScore, genre: genreScore, fav: favScore,
          buzz: item.buzz, quality: item.quality,
        };
        let numerator = 0;
        let denominator = 0;
        for (const key of Object.keys(parts)) {
          if (key === "buzz" || key === "quality" || active[key]) {
            numerator += parts[key] * cfg.weights[key];
            denominator += cfg.weights[key];
          }
        }

        matched.sort((a, b) => (b[0] - a[0]) || (a[1] < b[1] ? 1 : a[1] > b[1] ? -1 : 0));
        const labels = [];
        for (const pair of matched) if (!labels.includes(pair[1])) labels.push(pair[1]);

        return {
          item,
          score: numerator / denominator,
          titles: sims.filter(pair => pair[0] >= cfg.becauseMin).slice(0, 2).map(pair => pair[1]),
          tastes: labels.slice(0, 2),
          weak: (active.taste || active.fav) &&
                saturate(tastePos) < cfg.weakBelow && favPos < cfg.weakBelow,
        };
      }

      return { seen, evaluate };
    }

    /* Classement personnalisé d'une liste (période × média), titres vus exclus. */
    function rankPersonal(profile, period, media, limit) {
      const matcher = makeMatcher(profile);
      const ranked = [];
      for (const item of pool(period, media)) {
        if (matcher.seen.has(item.ref)) continue;
        ranked.push(matcher.evaluate(item));
      }
      ranked.sort((a, b) => b.score - a.score);
      return limit ? ranked.slice(0, limit) : ranked;
    }

    /* Classement général (buzz), titres vus ou masqués exclus. */
    function rankGeneral(hiddenRefs, period, media, limit) {
      const hidden = new Set(hiddenRefs);
      const ranked = pool(period, media)
        .filter(item => !hidden.has(item.ref))
        .sort((a, b) => (b.buzz - a.buzz) || (b.votes - a.votes))
        .map(item => ({ item, score: item.buzz, titles: [], tastes: [], weak: false }));
      return limit ? ranked.slice(0, limit) : ranked;
    }

    return { items, pool, rankPersonal, rankGeneral, makeMatcher };
  }

  const api = { createEngine };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  root.Media4uEngine = api;
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>/* Interface de la page : listes par période, « déjà vu », sauvegarde. Aucun serveur :
 * les choix sont gardés dans le navigateur (localStorage) et recalculés à chaque clic. */
(function () {
  "use strict";

  const DATA = JSON.parse(document.getElementById("data").textContent);
  const engine = window.Media4uEngine.createEngine(DATA);
  const POSTER = "https://image.tmdb.org/t/p/w342";
  const LEVEL_CHOICES = [[2, "❤️ Adoré"], [1, "👍 Aimé"], [0, "😐 Bof"], [-1, "👎 Pas aimé"]];
  const LEVEL_LABEL = { "2": "❤️ Adoré", "1": "👍 Aimé", "0": "😐 Bof", "-1": "👎 Pas aimé" };
  const root = document.getElementById("app");
  const toastEl = document.getElementById("toast");

  const esc = value => String(value == null ? "" : value).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ── Stockage (jamais bloquant : sans localStorage, tout reste en mémoire) ──
  const memory = {};
  function read(key, fallback) {
    try {
      const raw = window.localStorage.getItem(key);
      return raw ? JSON.parse(raw) : (key in memory ? memory[key] : fallback);
    } catch (e) {
      return key in memory ? memory[key] : fallback;
    }
  }
  function write(key, value) {
    memory[key] = value;
    try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* mémoire seule */ }
  }

  // ── État de l'interface ─────────────────────────────────────────────────
  const modes = [{ slug: "general", name: "Général" }]
    .concat(DATA.profiles.map(p => ({ slug: p.slug, name: p.name })));
  const periodKeys = DATA.periods.map(p => p.key);
  const ui = {
    period: periodKeys[0],
    media: "movie",
    mode: DATA.profiles.length ? DATA.profiles[0].slug : "general",
    pending: null,      // ref du titre dont on demande l'avis
    drawer: false,
  };
  const savedUi = read("media4u:ui", {}) || {};
  if (periodKeys.includes(savedUi.period)) ui.period = savedUi.period;
  if (savedUi.media && savedUi.media in DATA.media) ui.media = savedUi.media;
  if (modes.some(m => m.slug === savedUi.mode)) ui.mode = savedUi.mode;
  const fromHash = decodeURIComponent((window.location.hash || "").slice(1));
  if (modes.some(m => m.slug === fromHash)) ui.mode = fromHash;

  // ── Choix de la personne : titres vus (avec un avis) et titres masqués ──
  function userState(slug) {
    const stored = read("media4u:state:" + slug, {}) || {};
    return { seen: stored.seen || {}, hidden: stored.hidden || [] };
  }
  function saveState(slug, state) { write("media4u:state:" + slug, state); }

  function effectiveProfile(slug) {
    const base = DATA.profiles.find(p => p.slug === slug)
      || { families: {}, tastes: {}, favorites: [], hidden: [] };
    const state = userState(slug);
    const favorites = base.favorites.filter(f => !(f.media + ":" + f.id in state.seen));
    for (const [ref, level] of Object.entries(state.seen)) {
      const [media, id] = ref.split(":");
      favorites.push({ media, id: Number(id), level, source: "fav" });
    }
    return {
      families: base.families,
      tastes: base.tastes,
      favorites,
      hidden: (base.hidden || []).concat(state.hidden),
    };
  }

  function currentList() {
    const limit = DATA.config.listSize;
    if (ui.mode === "general") {
      const state = userState("general");
      return engine.rankGeneral(Object.keys(state.seen).concat(state.hidden), ui.period, ui.media, limit);
    }
    return engine.rankPersonal(effectiveProfile(ui.mode), ui.period, ui.media, limit);
  }

  const titleOf = ref => (engine.items.get(ref) || { title: ref }).title;

  // ── Actions ─────────────────────────────────────────────────────────────
  let toastTimer = null;
  function toast(message, undo) {
    toastEl.innerHTML = `<span>${esc(message)}</span>` + (undo ? '<button data-act="undo">Annuler</button>' : "");
    toastEl.hidden = false;
    toast.undo = undo || null;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.hidden = true; }, 7000);
  }

  function restore(ref, previous) {
    const state = userState(ui.mode);
    if (previous.seen === undefined) delete state.seen[ref]; else state.seen[ref] = previous.seen;
    state.hidden = state.hidden.filter(r => r !== ref);
    if (previous.hidden) state.hidden.push(ref);
    saveState(ui.mode, state);
    render();
  }

  function snapshot(ref) {
    const state = userState(ui.mode);
    return { seen: state.seen[ref], hidden: state.hidden.includes(ref) };
  }

  function setSeen(ref, level) {
    const before = snapshot(ref);
    const state = userState(ui.mode);
    state.seen[ref] = level;
    state.hidden = state.hidden.filter(r => r !== ref);
    saveState(ui.mode, state);
    ui.pending = null;
    toast(ui.mode === "general" ? "Titre masqué." : "Noté, ta liste est mise à jour.",
      () => restore(ref, before));
    render();
  }

  function hide(ref) {
    const before = snapshot(ref);
    const state = userState(ui.mode);
    if (!state.hidden.includes(ref)) state.hidden.push(ref);
    delete state.seen[ref];
    saveState(ui.mode, state);
    ui.pending = null;
    toast("Titre masqué.", () => restore(ref, before));
    render();
  }

  function download(filename, text) {
    const url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function exportState() {
    const state = userState(ui.mode);
    const payload = {
      app: "media4u", version: 1, profile: ui.mode,
      exported: new Date().toISOString(), seen: state.seen, hidden: state.hidden,
    };
    download("media4u-" + ui.mode + "-" + payload.exported.slice(0, 10) + ".json",
      JSON.stringify(payload, null, 2));
  }

  function importState(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const payload = JSON.parse(String(reader.result));
        if (payload.app !== "media4u" || typeof payload.seen !== "object") throw new Error("format");
        if (payload.profile && payload.profile !== ui.mode &&
            !window.confirm("Ce fichier vient du profil « " + payload.profile + " ». L'importer dans « " + ui.mode + " » ?")) return;
        saveState(ui.mode, { seen: payload.seen || {}, hidden: payload.hidden || [] });
        toast("Choix restaurés.");
        render();
      } catch (e) {
        toast("Fichier non reconnu.");
      }
    };
    reader.readAsText(file);
  }

  // ── Rendu ───────────────────────────────────────────────────────────────
  function runtime(minutes) {
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    if (!h) return m + " min";
    return m ? h + " h " + String(m).padStart(2, "0") : h + " h";
  }

  function cardHTML(rank, entry) {
    const { item } = entry;
    const d = item.data;
    const genres = (DATA.genres[item.media] || {});
    const meta = d.g.map(g => genres[g]).filter(Boolean).slice(0, 3);
    if (d.rt) meta.push(runtime(d.rt) + (item.media === "tv" ? " / épisode" : ""));
    if (item.media === "tv" && d.se) meta.push(d.se + " saison" + (d.se > 1 ? "s" : ""));

    const poster = d.po
      ? `<img src="${POSTER}${esc(d.po)}" alt="" loading="lazy">`
      : '<div class="noposter">Pas d\'affiche</div>';
    const note = Number(d.v).toFixed(1).replace(".", ",");
    const votes = Number(d.n).toLocaleString("fr-FR");

    let because = "";
    if (entry.titles.length) because += `<p class="because"><b>Proche de :</b> ${esc(entry.titles.join(", "))}</p>`;
    if (entry.tastes.length) {
      because += '<div class="chips">' + entry.tastes.map(t => `<span class="chip">${esc(t)}</span>`).join("") + "</div>";
    }
    if (entry.weak) because += '<p class="weak">Peu de rapport avec tes goûts</p>';

    let actions;
    if (ui.pending === item.ref) {
      actions = `<div class="ask"><p>Tu en as pensé quoi ?</p><div class="levels">` +
        LEVEL_CHOICES.map(([level, label]) =>
          `<button class="mini" data-act="level" data-ref="${item.ref}" data-level="${level}">${label}</button>`).join("") +
        `<button class="mini" data-act="cancel">Annuler</button></div></div>`;
    } else {
      actions = `<div class="card-actions">
        <button class="mini primary" data-act="seen" data-ref="${item.ref}">Déjà vu</button>
        <button class="mini" data-act="hide" data-ref="${item.ref}">Pas intéressé</button></div>`;
    }

    return `<li class="card"><span class="rank">${rank}</span>${poster}<div class="body">
      <h3>${esc(d.t)} <span class="year">(${esc(d.y)})</span></h3>
      <p class="meta">${esc(meta.join(" · "))}</p>
      <p class="note"><strong>★ ${note}</strong> · ${votes} votes</p>
      ${d.tg ? `<p class="tagline">« ${esc(d.tg)} »</p>` : ""}${because}
      ${d.ov ? `<details><summary>Voir le synopsis (peut spoiler)</summary><p>${esc(d.ov)}</p></details>` : ""}
      ${actions}</div></li>`;
  }

  function drawerHTML() {
    const state = userState(ui.mode);
    const seenRefs = Object.keys(state.seen);
    const base = DATA.profiles.find(p => p.slug === ui.mode);
    const fromQuiz = base ? base.favorites.filter(f => (f.source || "fav") === "fav").length : 0;

    const seenRows = seenRefs.map(ref => `<div class="row"><span class="t">${esc(titleOf(ref))}</span>
      <span class="levels">${ui.mode === "general" ? "" : LEVEL_CHOICES.map(([level, label]) =>
        `<button class="mini ${state.seen[ref] === level ? "primary" : ""}" data-act="relevel" data-ref="${ref}" data-level="${level}">${label}</button>`).join("")}
      <button class="mini" data-act="forget" data-ref="${ref}">Remettre</button></span></div>`).join("");
    const hiddenRows = state.hidden.map(ref => `<div class="row"><span class="t">${esc(titleOf(ref))}</span>
      <button class="mini" data-act="forget" data-ref="${ref}">Remettre</button></div>`).join("");

    return `<div class="drawer-back" data-act="close"></div>
      <aside class="drawer" role="dialog" aria-label="Mes titres vus">
        <button class="mini" data-act="close" style="float:right">Fermer</button>
        <h2>Mes titres vus</h2>
        <p class="note-small">Chaque titre noté ici affine ta sélection. Tes choix sont gardés sur cet
        appareil${fromQuiz ? ` ; les ${fromQuiz} titres du quiz sont déjà pris en compte` : ""}.</p>
        <h3>Vus (${seenRefs.length})</h3>${seenRows || '<p class="note-small">Aucun pour l\'instant.</p>'}
        <h3>Masqués (${state.hidden.length})</h3>${hiddenRows || '<p class="note-small">Aucun.</p>'}
        <h3>Sauvegarde</h3>
        <p class="note-small">« Sauvegarder » télécharge un fichier avec tes choix : utile pour changer
        d'appareil ou les conserver durablement.</p>
        <div class="tools">
          <button class="mini primary" data-act="export">Sauvegarder mes choix</button>
          <label class="mini" style="cursor:pointer">Restaurer<input type="file" accept="application/json" data-act="import" hidden></label>
          <button class="mini" data-act="reset">Tout effacer</button>
        </div>
      </aside>`;
  }

  function render() {
    const scroll = window.scrollY;
    const period = DATA.periods.find(p => p.key === ui.period);
    const mode = modes.find(m => m.slug === ui.mode);
    const entries = currentList();
    const state = userState(ui.mode);
    const done = Object.keys(state.seen).length;

    const tabs = DATA.periods.map(p => `<button class="tab" role="tab" data-act="period" data-value="${p.key}"
      aria-selected="${p.key === ui.period}"><span class="t">${esc(p.label)}</span><span class="h">${esc(p.hint)}</span></button>`).join("");
    const mediaSwitch = Object.entries(DATA.media).map(([key, label]) =>
      `<button data-act="media" data-value="${key}" aria-pressed="${key === ui.media}">${esc(label)}</button>`).join("");
    const modeSwitch = modes.length > 1 ? '<div class="switch">' + modes.map(m =>
      `<button data-act="mode" data-value="${esc(m.slug)}" aria-pressed="${m.slug === ui.mode}">${esc(m.name)}</button>`).join("") + "</div>" : "";

    const caption = (ui.mode === "general" ? "" : "Classés selon les goûts de " + mode.name + " · ") +
      "sortis du " + period.gte + " au " + period.lte;
    const cards = entries.length
      ? entries.map((entry, i) => cardHTML(i + 1, entry)).join("")
      : '<li class="empty">Plus rien à proposer ici : tout a été vu ou masqué. Reviens après la prochaine mise à jour.</li>';
    const local = ["127.0.0.1", "localhost"].includes(window.location.hostname);

    root.innerHTML = `
      <header class="top">
        <div><h1>Media 4 u</h1>
        <p class="sub">Ce qui est sorti et fait parler de lui. Aucun spoil : les synopsis restent repliés.</p></div>
        <div class="head-actions">
          <button class="pill" data-act="open">Mes titres vus${done ? " (" + done + ")" : ""}</button>
          ${local ? '<a class="pill" href="/">Mes goûts</a>' : ""}
        </div>
      </header>
      <nav class="tabs" role="tablist">${tabs}</nav>
      <div class="switches"><div class="switch">${mediaSwitch}</div>${modeSwitch}</div>
      <p class="window">${esc(caption)}</p>
      <ol class="cards">${cards}</ol>
      <footer>
        <img src="https://www.themoviedb.org/assets/v4/logos/v2/blue_short-8e7b30f73a4020692ccca9c88bafe5dcb6f8a62a4c6bc55cd9ba82bb2cd95f6c.svg" alt="TMDB">
        <span>This product uses the TMDB API but is not endorsed or certified by TMDB.</span>
        <span>Mise à jour : ${esc(DATA.generated)}</span>
      </footer>
      ${ui.drawer ? drawerHTML() : ""}`;
    window.scrollTo(0, scroll);
    write("media4u:ui", { period: ui.period, media: ui.media, mode: ui.mode });
  }

  // ── Événements ──────────────────────────────────────────────────────────
  document.addEventListener("click", event => {
    const target = event.target.closest("[data-act]");
    if (!target) return;
    const { act, value, ref, level } = target.dataset;
    switch (act) {
      case "period": ui.period = value; ui.pending = null; break;
      case "media": ui.media = value; ui.pending = null; break;
      case "mode": ui.mode = value; ui.pending = null; break;
      case "seen":
        if (ui.mode === "general") return setSeen(ref, 0);
        ui.pending = ref; break;
      case "level": return setSeen(ref, Number(level));
      case "cancel": ui.pending = null; break;
      case "hide": return hide(ref);
      case "open": ui.drawer = true; break;
      case "close": ui.drawer = false; break;
      case "relevel": {
        const state = userState(ui.mode);
        state.seen[ref] = Number(level);
        saveState(ui.mode, state);
        break;
      }
      case "forget": restore(ref, { seen: undefined, hidden: false }); return;
      case "export": return exportState();
      case "reset":
        if (!window.confirm("Effacer tous les titres vus et masqués de ce profil ?")) return;
        saveState(ui.mode, { seen: {}, hidden: [] });
        break;
      case "undo":
        if (toast.undo) toast.undo();
        toastEl.hidden = true;
        return;
      case "import": return;
      default: return;
    }
    render();
  });

  document.addEventListener("change", event => {
    const input = event.target.closest('input[data-act="import"]');
    if (input && input.files && input.files[0]) importState(input.files[0]);
  });

  render();
})();
</script>
