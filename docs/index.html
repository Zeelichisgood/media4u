<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Media 4 u</title>
<style>:root{--bg:#f6f5f2;--card:#fff;--text:#1d1d1f;--muted:#6b6b72;--line:#e3e1db;--accent:#b4442f;--accent-soft:#f6e4df;--good:#2f7d4f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--card:#212125;--text:#f1f0ed;--muted:#a3a3ab;--line:#33333a;--accent:#ef8a73;--accent-soft:#3a2723;--good:#7fd1a0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header.top{padding:28px 0 8px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:1.7rem;letter-spacing:-.02em}
.sub{margin:4px 0 0;color:var(--muted)}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.pill{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:.9rem;text-decoration:none;color:var(--accent)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0 12px}
.tab{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;text-align:left}
.tab .t{display:block;font-weight:600}
.tab .h{display:block;font-size:.8rem;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.switches{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.switch{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.switch button{appearance:none;border:0;background:transparent;padding:8px 20px}
.switch button[aria-pressed="true"]{background:var(--accent);color:#fff}
.window{color:var(--muted);font-size:.9rem;margin:0 0 12px}
ol.cards{list-style:none;margin:0;padding:0;display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
.card{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;position:relative}
.card .body{min-width:0;flex:1}
.card img,.card .noposter{width:92px;flex:none;aspect-ratio:2/3;object-fit:cover;border-radius:8px;background:var(--line);align-self:flex-start}
.card .noposter{display:grid;place-items:center;color:var(--muted);font-size:.8rem;text-align:center}
.rank{position:absolute;top:-8px;left:-8px;background:var(--accent);color:#fff;font-weight:700;font-size:.8rem;min-width:26px;height:26px;border-radius:13px;display:grid;place-items:center;padding:0 6px}
.card h3{margin:0;font-size:1.02rem;line-height:1.3}
.card .year{color:var(--muted);font-weight:400}
.meta,.note{margin:2px 0;font-size:.88rem;color:var(--muted)}
.note strong{color:var(--text)}
.tagline{margin:6px 0 0;font-size:.9rem;font-style:italic}
.because{margin:6px 0 0;font-size:.88rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 10px;font-size:.78rem}
.weak{margin:6px 0 0;font-size:.82rem;color:var(--muted);font-style:italic}
details{margin-top:8px;font-size:.88rem}
summary{cursor:pointer;color:var(--accent)}
details p{margin:6px 0 0;color:var(--muted)}
.card-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.mini{appearance:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:.84rem}
.mini:hover{border-color:var(--accent)}
.mini.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.ask{margin-top:10px;padding:10px;border:1px dashed var(--accent);border-radius:12px;background:var(--accent-soft)}
.ask p{margin:0 0 8px;font-size:.88rem}
.levels{display:flex;gap:6px;flex-wrap:wrap}
.empty{color:var(--muted);padding:24px 0}
footer{margin:36px 0 28px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.82rem;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
footer img{height:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;display:flex;gap:12px;align-items:center;box-shadow:0 4px 20px rgba(0,0,0,.25);z-index:30;max-width:calc(100vw - 32px)}
.toast[hidden]{display:none}
.toast button{appearance:none;border:0;background:transparent;color:inherit;text-decoration:underline;padding:0}
.drawer-back{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--bg);border-left:1px solid var(--line);z-index:25;overflow-y:auto;padding:20px 16px 40px}
.drawer h2{margin:0 0 4px;font-size:1.2rem}
.drawer h3{margin:20px 0 8px;font-size:1rem}
.drawer .row{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 10px;margin-bottom:6px;flex-wrap:wrap}
.drawer .row .t{flex:1;min-width:140px;font-size:.92rem}
.drawer .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.note-small{color:var(--muted);font-size:.84rem}
@media (max-width:720px){.tabs{grid-template-columns:repeat(2,1fr)}ol.cards{grid-template-columns:1fr}}
</style>
</head>

98733,3533641],"rc":[],"p":"p1","bz":0.91875,"q":0.9375,"n":544,"v":8.022,"rt":112,"se":null,"tg":"C'est testé et confirmé. La chimie est là.","ov":"Tiré du best-seller cité par le New York Times, The Love Hypothesis suit Olive (Lili Reinhart), une doctorante qui embrasse sur un coup de tête Adam Carlsen (Tom Bateman), le professeur le plus intimidant de son département à la fac. Leur besoin mutuel d'une fausse relation se transforme en une expérience de chimie capable, contre toute attente, de résoudre l'équation de l'amour.","po":"/6hfjkMZIsAOVdNC4NAAmCYthC7r.jpg"},{"m":"movie","i":1148365,"t":"Matchbox – Le film","y":"2026","g":[28,35,12],"k":[27,28,29,30,31,32,33,34],"cr":[1120883],"ca":[56446,10860,1429453,1457999,970219],"rc":[575264],"p":"p1","bz":0.8708333333333333,"q":0.8541666666666666,"n":81,"v":7.654,"rt":126,"se":null,"tg":"Foncez vers l’aventure.","ov":"Des amis d'enfance reprennent contact et les retrouvailles prennent une tournure inattendue quand ils découvrent un dangereux complot international et doivent sauver le monde.","po":"/vSgnJDw404JUokiy5NDZgXOi01E.jpg"},{"m":"movie","i":1191818,"t":"Histoires de la nuit","y":"2026","g":[53],"k":[],"cr":[1702466],"ca":[54338,5442,910944,28782,5542216],"rc":[],"p":"p1","bz":0.153125,"q":0.22916666666666666,"n":19,"v":6.1,"rt":114,"se":null,"tg":null,"ov":"Il ne reste presque plus rien à La Bassée : un bourg et quelques hameaux, dont celui qu’occupent Bergogne, sa femme Marion et leur fille Ida, ainsi qu’une voisine, Christine, une artiste installée ici depuis des années. On s’active, on se prépare pour l’anniversaire de Marion, dont on va fêter les quarante ans. Mais alors que la fête se profile, des inconnus rôdent autour du hameau.","po":"/7prAuNDsQPUlHKyXiYNkuofyi0G.jpg"},{"m":"movie","i":1198654,"t":"Bad Apples","y":"2026","g":[35,53],"k":[18,35,36,37,38,39],"cr":[1878578],"ca":[36592,5652914,5652915,964792,195575],"rc":[],"p":"p1","bz":0.375,"q":0.5416666666666666,"n":29,"v":7.0,"rt":100,"se":null,"tg" rite des centaines de dragons sauvages, dont le mystérieux Dragon Rider. Les deux amis se retrouvent alors au centre d’une lutte visant à maintenir la paix. Harold et Krokmou vont se battre pour défendre leurs valeurs et préserver le destin des hommes et des dragons.","po":"/q6UtQBNwyfRa5WDQqQOnvwsPOB2.jpg"},{"m":"movie","i":83666,"t":"Moonrise Kingdom","y":"2012","g":[35,18,10749],"k":[516,2604,2605,717,2606,2607,191,2608,464,2609,1173,2610,2045,1016,1187,1181,2611,2612,2613,2614,742],"cr":[5655],"ca":[929906,929905,62,819,1532],"rc":[],"p":"p4","bz":0.3668341708542714,"q":0.4472361809045226,"n":6514,"v":7.7,"rt":94,"se":null,"tg":null,"ov":"Sur une île au large de la Nouvelle-Angleterre, au cœur de l’été 1965, Suzy et Sam, douze ans, tombent amoureux, concluent un pacte secret et s’enfuient ensemble. Alors que chacun se mobilise pour les retrouver, une violente tempête s’approche des côtes et va bouleverser davantage encore la vie de la communauté.","po":"/iDfjUWJ0w8XmEgaL4n1m7GI86BE.jpg"},{"m":"movie","i":84892,"t":"Le Monde de Charlie","y":"2012","g":[18],"k":[186,2615,18,908,1464,191,1331,1173,2616,31,1064,240,1289,153,1065,2555,466,2617,1206,2618,403,1069,381,500],"cr":[19311],"ca":[33235,10990,132157,52404,61114],"rc":[],"p":"p4","bz":0.5668341708542715,"q":0.592964824120603,"n":11512,"v":7.806,"rt":103,"se":null,"tg":"Nous sommes infinis.","ov":"Au lycée où il vient d’arriver, on trouve Charlie bizarre. Sa sensibilité et ses goûts sont en décalage avec ceux de ses camarades de classe. Pour son prof de Lettres, c’est sans doute un prodige, pour les autres, c’est juste un « loser ». En attendant, il reste en marge – jusqu’au jour où deux terminales, Patrick et la jolie Sam, le prennent sous leur aile. Grâce à eux, il va découvrir la musique, les fêtes, le sexe… pour Charlie, un nouveau monde s’offre à lui.","po":"/k5tpS5SMZelIhiptSaGT0QbYowz.jpg"},{"m":"movie","i":85350,"t":"Boyhood","y":"2014","g":[18],"k":[689,231,191,383,2458,1868,140,2619,2620,240,1119,353,381,2621],"cr":[564],"ca":[931944,4687,569,1327009,2857],"rc":[],"p":"p4","bz":0.1949748743718593,"q":0.135678391959799,"n":5666,"v":7.5,"rt":165,"se":null,"tg":"Filmé pendant 12 ans. Venez le voir grandir.","ov":"Chaque année, durant 12 ans, le réalisateur Richard Linklater a réuni les mêmes comédiens pour un film unique sur la famille et le temps qui passe. On y suit le jeune Mason de l’âge de six ans jusqu’ à sa majorité, vivant avec sa sœur et sa mère, séparée de son père. Les déménagements, les amis, les rentrées des classes, les premiers émois, les petits riens et les grandes décisions qui rythment sa jeunesse et le préparent à devenir adulte...","po":"/mptsEv59gjAtAAuRUrERSMCFkAj.jpg"},{"m":"movie","i":96721,"t":"Rush","y":"2013","g":[18,28],"k":[1406,958,8,2622,481,562,279,2623,2106,2624],"cr":[6159],"ca":[74568,3872,59315,5644,17839],"rc":[359724,911430],"p":"p4","bz":0.4552763819095478,"q":0.507537688442211,"n":8087,"v":7.746,"rt":123,"se":null,"tg":"Le plus grand duel de l'histoire de la F1.","ov":"Le combat entre deux des plus grands rivaux que l’histoire du sport ait jamais connus, celui de James Hunt et Niki Lauda concourant pour les illustres écuries McLaren et Ferrari. Issu de la classe des privilégiés, charismatique et beau garçon, tout oppose le play-boy anglais James Hunt à Niki Lauda, son adversaire autrichien, réservé et méthodique. RUSH suit la vie instable de ces deux pilotes, sur les circuits et en dehors, et retrace leur rivalité depuis leurs tout débuts.","po":"/zQT3B6t7DDbW9sDUxZw9Vf8MTvF.jpg"},{"m":"movie","i":100402,"t":"Captain America : Le Soldat de l'hiver","y":"2014","g":[28,12,878],"k":[127,419,464,540,49,89,793,477,2625],"cr":[19272,19271],"ca":[16828,2231,1245,4135,60898],"rc":[271110,447365,283995,24428,969681,127585,299536,634649],"p":"p4","bz":0.6060301507537689,"q":0.35678391959798994,"n":20553,"v":7.655,"rt":136,"se":null,"tg":"Nous avons confiance en nos héros.","ov":"Après les événements cataclysmiques de New York de The Avengers, Steve Rogers aka Captain America vit tranquillement à Washington, D.C. et essaye de s'adapter au monde moderne. Mais quand un collègue du S.H.I.E.L.D. est attaqué, Steve se retrouve impliqué dans un réseau d'intrigues qui met le monde en danger. S'associant à Black Widow, Captain America lutte pour dénoncer une conspiration grandissante, tout en repoussant des tueurs professionnels envoyés pour le faire taire. Quand l'étendue du plan maléfique est révélée, Captain America et Black Widow sollicitent l'aide d'un nouvel allié, le Faucon. Cependant, ils se retrouvent bientôt face à un inattendu et redoutable ennemi - le Soldat de l'Hiver.","po":"/n3Xa8g1sWrUVUal6zk0OoC9ARo1.jpg"},{"m":"movie","i":103663,"t":"La Chasse","y":"2012","g":[18],"k":[2179,2626,2627,2628,383,2629,2630,2631,2632,2633,709,2634,1097,2635,121,2636,396,1206,1209,2173],"cr":[4453],"ca":[1019,4457,1112385,1188827,47156],"rc":[],"p":"p4","bz":0.4804020100502513,"q":0.8291457286432161,"n":5019,"v":8.097,"rt":116,"se":null,"tg":"Un mensonge fortuit frappe un homme innocent.","ov":"Après un divorce difficile, Lucas, quarante ans, a trouvé une nouvelle petite amie, un nouveau travail et il s’applique à reconstruire sa relation avec Marcus, son fils adolescent. Mais quelque chose tourne mal. Presque rien. Une remarque en passant. Un mensonge fortuit. Et alors que la neige commence à tomber et que les lumières de Noël s’illuminent, le mensonge se répand comme un virus invisible. La stupeur et la méfiance se propagent et la petite communauté plonge dans l’hystérie collective, obligeant Lucas à se battre pour sauver sa vie et sa dignité.","po":"/rWvp8PaWrieqoUTgEwRMo7RsELj.jpg"},{"m":"movie","i":106646,"t":"Le Loup de Wall Street","y":"2013","g":[80,18,35],"k":[517,1021,18,389,8,278,2637,1252,2638,2639,84,2640,2641,2351,1179,2642,2643,2644,2425,2645,2646,2647,2648,2649,2650,2651,2652],"cr":[1032],"ca":[6193,21007,234352,10297,3497],"rc":[],"p":"p4","bz":0.885427135678392,"q":0.8492462311557789,"n":26685,"v":8.027,"rt":179,"se":null,"tg":"L'argent, le pouvoir, les femmes, la drogue… Trop n'est jamais assez.","ov":"Sa licence de courtier en poche, et les narines déjà pleines de cocaïne, Jordan Belfort est prêt à conquérir Wall Street. Ce jour d'octobre, un krach, le plus important depuis 1929, vient piétiner ses rêves de grandeur. C'est finalement à Long Island qu'il échoue et qu'il monte sa propre affaire de courtage. Son créneau : le hors-cote. Sa méthode : l'arnaque. Son équipe : des vendeurs ou des petits trafiquants.","po":"/dQIQZbJXn1pflQw3nwvXLJX0dHa.jpg"},{"m":"movie","i":109424,"t":"Capitaine Phillips","y":"2013","g":[28,18,53],"k":[456,8,815,2653,345,2654,421,2655,2656,953,2657,2658,2659,218],"cr":[25598],"ca":[31,1261694,1266859,1266858,1266862],"rc":[1288445,799882],"p":"p4","bz":0.2894472361809045,"q":0.15577889447236182,"n":7726,"v":7.535,"rt":134,"se":null,"tg":"Tout faire pour survivre.","ov":"Capitaine Phillips retrace l’histoire vraie de la prise d’otages du navire de marine marchande américain Maersk Alabama, menée en 2009 par des pirates somaliens. La relation qui s’instaure entre le capitaine Richard Phillips, commandant du bateau, et Muse, le chef des pirates somaliens qui le prend en otage, est au cœur du récit. Les deux hommes sont inévitablement amenés à s’affronter lorsque Muse et son équipe s’attaquent au navire désarmé de Phillips. À plus de 230 kilomètres des côtes somaliennes, les deux camps vont se retrouver à la merci de forces qui les dépassent…","po":"/yitWrzHgQfeFMwvjTJwqX7zQG3z.jpg"},{"m":"movie","i":118340,"t":"Les Gardiens de la Galaxie","y":"2014","g":[28,878,12],"k":[1406,127,419,464,540,1181,575,2660],"cr":[15218],"ca":[73457,8691,543530,12835,51329],"rc":[447365,283995,299536,24428,127585,284053],"p":"p4","bz":0.7608040201005025,"q":0.7185929648241206,"n":30436,"v":7.907,"rt":121,"se":null,"tg":"Tous les héros commencent quelque part.","ov":"Peter Quill est un aventurier traqué par tous les chasseurs de primes pour avoir volé un mystérieux globe convoité par le puissant Ronan, dont les agissements menacent l’univers tout entier. Lorsqu’il découvre le véritable pouvoir de ce globe et la menace qui pèse sur la galaxie, il conclut une alliance fragile avec quatre aliens disparates : Rocket, un raton laveur fin tireur, Groot, un humanoïde semblable à un arbre, l’énigmatique et mortelle Gamora, et Drax le Destructeur, qui ne rêve que de vengeance. En les ralliant à sa cause, il les convainc de livrer un ultime combat aussi désespéré soit‐il pour sauver ce qui peut encore l’être…","po":"/9a6fGeSV5kffyNPPMWCPhLOhLdJ.jpg"},{"m":"movie","i":120467,"t":"The Grand Budapest Hotel","y":"2014","g":[35,18],"k":[149,516,2386,2661,464,2662,2663,2664,61,1702,2665,2666,2450,316,2667,936,2668],"cr":[5655],"ca":[5469,1164,1291350,3490,5293],"rc":[],"p":"p4","bz":0.7819095477386935,"q":0.8341708542713567,"n":16586,"v":8.025,"rt":100,"se":null,"tg":"Une affaire de meurtre pour le concierge.","ov":"Pendant l’entre‐deux guerres, le légendaire concierge d’un grand hôtel et son jeune protégé se retrouvent impliqués dans une histoire mêlant le vol d’un tableau de la Renaissance, la bataille pour une énorme fortune familiale, et le lent puis soudain bouleversement qui transforme l’Europe en cette première moitié de XXème siècle.","po":"/qcWTuWPu6x6t2MKt0MTfbResJiV.jpg"},{"m":"movie","i":122906,"t":"Il était Temps","y":"2013","g":[18,10749,14],"k":[519,480,1058,359,398,481,2669,533,140,1035,1419,241,2303,976,1097,1736,1970,339,2670,619,2671,2672,2673,2331],"cr":[7018],"ca":[93210,53714,2440,2441,234352],"rc":[],"p":"p4","bz":0.6211055276381909,"q":0.6834170854271356,"n":9558,"v":7.901,"rt":123,"se":null,"tg":"Et si chaque moment de la vie s'accompagnait d'une seconde chance ?","ov":"À 21 ans révolus, Tim Lake découvre qu'il a le pouvoir de voyager dans le temps… Au lendemain d'un réveillon de jour de l'an encore décevant, le père de Tim révèle à son fils que tous les hommes de la famille ont, depuis toujours, la faculté de voyager dans le temps. Tim ne peut pas changer le cours de l'histoire mais il peut changer ce qui se passe et s'est passé dans sa vie. Il décide d'améliorer son existence… en se trouvant une petite amie.","po":"/eoOvm8cUtjxmfHX6i6a3maEhjCj.jpg"},{"m":"movie","i":127585,"t":"X-Men : Days of Future Past","y":"2014","g":[28,12,878],"k":[297,127,419,2674,2675,2676,622,464,551,2677,2513,2678,477,2679,619],"cr":[9032],"ca":[6968,5530,17288,2387,1327],"rc":[24428,447365,118340,100402,299536,283995,271110,284053],"p":"p4","bz":0.45829145728643217,"q":0.09045226130653267,"n":16754,"v":7.537,"rt":131,"se":null,"tg":"Pour sauver le futur, ils doivent changer le passé.","ov":"Dans un futur proche, les mutants et les humains ont été décimés par les Sentinelles, des robots biologiques capables de copier les pouvoirs des mutants. Seuls quelques mutants, dont Kitty Pride, Iceman, Storm et Bishop, résistent encore. Le Professeur X et Magneto décident d’envoyer Logan dans le passé afin d’empêcher le meurtre de Bolivar Trask, un scientifique américain responsable du programme d’armement dont la mort déclenchera le programme des Sentinelles. Wolverine arrive donc en 1973 afin de convaincre Charles Xavier et Erik Lehnsherr de stopper Mystique dans sa mission, une tâche qu’ils devront accomplir avec l’aide de Beast et de Quicksilver.","po":"/zGSi4NG7SfyILp3SOfBgVo4VoWG.jpg"},{"m":"movie","i":137113,"t":"Edge of Tomorrow","y":"2014","g":[28,878],"k":[1092,762,763,18,391,2680,448,2681,2682,629,2683,2684,792,1525,418,2685,619,2686,1526,2209],"cr":[11694],"ca":[500,5081,2039,2053,119224],"rc":[299534,330459],"p":"p4","bz":0.55678391959799,"q":0.35175879396984927,"n":15592,"v":7.644,"rt":108,"se":null,"tg":"Vivre. Mourir. Recommencer.","ov":"Dans un futur proche, des hordes d’extraterrestres ont livré une bataille acharnée contre la Terre et semblent désormais invincibles : aucune armée au monde n’a réussi à les vaincre. Le commandant William Cage, qui n’a jamais combattu de sa vie, est envoyé, sans la moindre explication, dans ce qui ressemble à une mission‐suicide. Il meurt en l’espace de quelques minutes et se retrouve projeté dans une boucle temporelle, condamné à revivre le même combat et à mourir de nouveau indéfiniment…","po":"/mZgaULvOfCMc2MVKm0DzDLvi5ZU.jpg"},{"m":"movie","i":138843,"t":"Conjuring : Les Dossiers Warren","y":"2013","g":[27,53],"k":[297,8,2687,2031,938,2225,2688,2689,980,210,141,2690,2691,697,2692,2693,528],"cr":[2127],"ca":[21657,17178,3127,17402,63663],"rc":[756999],"p":"p4","bz":0.5015075376884423,"q":0.10552763819095477,"n":13157,"v":7.544,"rt":112,"se":null,"tg":"Inspiré de faits réels","ov":"Avant Amityville, il y avait Harrisville… Conjuring : Les dossiers Warren, raconte l'histoire horrible, mais vraie, d'Ed et Lorraine Warren, enquêteurs paranormaux réputés dans le monde entier, venus en aide à une famille terrorisée par une présence inquiétante dans leur ferme isolée… Contraints d'affronter une créature démoniaque d'une force redoutable, les Warren se retrouvent face à l'affaire la plus terrifiante de leur carrière.","po":"/vOnTvcSsxdJWL9xgauljHHmFSN4.jpg"},{"m":"movie","i":146233,"t":"Prisoners","y":"2013","g":[18,53,80],"k":[2537,975,417,2630,826,46,2694,2695,98,2696,2697,2698,1621,998],"cr":[137427],"ca":[6968,131,19492,49,18288],"rc":[860508],"p":"p4","bz":0.7376884422110553,"q":0.8793969849246231,"n":13599,"v":8.105,"rt":153,"se":null,"tg":"Une recherche désespérée.","ov":"Dans la banlieue de Boston, deux fillettes de 6 ans, Anna et Joy, ont disparu. Le détective Loki privilégie la thèse du kidnapping suite au témoignage de Keller, le père d’Anna. Le suspect numéro 1 est rapidement arrêté mais est relâché quelques jours plus tard faute de preuve, entrainant la fureur de Keller. Aveuglé par sa douleur, le père dévasté se lance alors dans une course contre la montre pour retrouver les enfants disparus. De son côté, Loki essaie de trouver des indices pour arrêter le coupable avant que Keller ne commette l’irréparable… Les jours passent et les chances de retrouver les fillettes s’amenuisent…","po":"/fUk1f0iOAezl5PZ7gQW6nrguOXk.jpg"},{"m":"movie","i":149870,"t":"Le Vent se lève","y":"2013","g":[16,18,36,10749],"k":[1355,888,443,278,2699,2700,171,2701,2511,22,1106,2702,2703,2704,877],"cr":[608],"ca":[77921,13250,227612,20333,2023564],"rc":[],"p":"p4","bz":0.30954773869346736,"q":0.5628140703517588,"n":3510,"v":7.8,"rt":126,"se":null,"tg":"Les avions sont des rêves merveilleux","ov":"Inspiré par le fameux concepteur d'avions Giovanni Caproni, Jiro rêve de voler et de dessiner de magnifiques avions. Mais sa mauvaise vue l'empêche de devenir pilote, et il se fait engager dans le département aéronautique d'une importante entreprise d'ingénierie en 1927. Son génie l'impose rapidement comme l'un des plus grands ingénieurs du monde. Le Vent se lève raconte une grande partie de sa vie et dépeint les événements historiques clés qui ont profondément influencé le cours de son existence, dont le séisme de Kanto en 1923, la Grande Dépression, l'épidémie de tuberculose et l'entrée en guerre du Japon. Jiro connaîtra l'amour avec Nahoko et l'amitié avec son collègue Honjo. Inventeur extraordinaire, il fera entrer l'aviation dans une ère nouvelle.","po":"/bQcNJ8inwZuxAZ965jRCjjCti0D.jpg"},{"m":"movie","i":150540,"t":"Vice-versa","y":"2015","g":[16,10751,12,18,35],"k":[187,2705,2706,2707,481,2708,1869,464,2709,2710,2711,238,650,140,302,2228,1419,2712,2713,200,2714,595,396,2715,2716,483,1057],"cr":[12890],"ca":[56322,169200,21125,19278,59258],"rc":[1022789,927254,1117857,1465063],"p":"p4","bz":0.8502512562814071,"q":0.7085427135678392,"n":23990,"v":7.906,"rt":94,"se":null,"tg":"Faites connaissance avec vos émotions","ov":"Riley est déracinée du Mid-Ouest quand son père est muté à San Francisco. Comme tous, Riley est guidée par ses Émotions : Joie, Peur, Colère, Dégoût et Tristesse. Les Émotions vivent au Quartier Cérébral, où elles la conseillent au quotidien. Alors que Riley et ses Émotions se bagarrent, c’est la crise au Quartier Cérébral. Joie, l'Émotion principale de Riley, essaie de rester positive alors que les autres Émotions essaient de s'adapter à la nouvelle vie de Riley.","po":"/KUhrtJN02RNt3Sxc4IMTa1d9Lt.jpg"},{"m":"movie","i":152532,"t":"Dallas Buyers Club","y":"2013","g":[18,36],"k":[517,2717,2179,8,278,2718,1179,2719,2720,153,2488,2721,126,2722,2723],"cr":[69371],"ca":[10297,9278,7499,81681,18324],"rc":[],"p":"p4","bz":0.5226130653266332,"q":0.6884422110552764,"n":9314,"v":7.904,"rt":116,"se":null,"tg":"Oser vivre!","ov":"1986, Dallas, Texas. Ron Woodroof, cow‐boy de 35 ans, des bottes, un Stetson. Sa vie: sexe, drogue et rodéo. Tout bascule quand le sida (VIH) est diagnostiqué avec une espérance de vie de trente jours. Soulevé par l’impuissance du corps médical qui n'a le droit qu'à l'inefficace AZT, il recourt à des traitements alternatifs de l'Étranger non officiels. Au fil du temps, il rassemble d’autres malades en quête de guérison : le « Dallas Buyers Club » est né. Mais son succès gêne les lobbies, Ron doit s’engager dans une bataille contre les laboratoires et les autorités fédérales. C’est son combat pour une nouvelle cause et pour sa propre vie.  Film librement inspiré de la vie de Ron Woodroof (1950 - 1992).","po":"/d4eSE546uRJTaQdLlqz4alKwcZf.jpg"},{"m":"movie","i":152601,"t":"Her","y":"2013","g":[10749,878,18],"k":[840,398,2724,622,1775,2725,241,275,803,22,1628,2726,654,37,2727,2728,2729,2730,548],"cr":[5953],"ca":[73421,1245,549831,154798,1509453],"rc":[264660],"p":"p4","bz":0.6412060301507538,"q":0.6381909547738693,"n":15716,"v":7.834,"rt":126,"se":null,"tg":"Une histoire d'amour avec une IA.","ov":"Los Angeles, dans un futur proche. Theodore Twombly, un homme sensible au caractère complexe, est inconsolable suite à une rupture difficile. Il fait alors l'acquisition d'un programme informatique ultramoderne, capable de s'adapter à la personnalité de chaque utilisateur. En lançant le système, il fait la connaissance de 'Samantha', une voix féminine intelligente, intuitive et étonnamment drôle. Les besoins et les désirs de Samantha grandissent et évoluent, tout comme ceux de Theodore, et peu à peu, ils tombent amoureux…","po":"/nkWXW5blXGmOEoDejRgy83sSb6T.jpg"},{"m":"movie","i":152742,"t":"The Best Offer","y":"2013","g":[18,10749,80],"k":[2731,2732,2733,2734,2450],"cr":[65314],"ca":[118,38941,104632,55636,1133330],"rc":[],"p":"p4","bz":0.24522613065326634,"q":0.5577889447236181,"n":3164,"v":7.8,"rt":130,"se":null,"tg":"Un maître de la possession. Un crime d'obsession.","ov":"Virgil Oldman est un commissaire priseur de renom. Véritable institution dans le milieu de l'art et misogyne assumé, il n'a de relation intime qu'avec la collection de tableaux qu'il a su constituer secrètement au cours des années. Personne ne le connaît vraiment, même pas son vieil ami marchand d'art Billy. Lorsqu'une cliente lui demande une expertise mais n'accepte de lui parler qu'au téléphone, Virgil est piqué de curiosité et ne peut se résoudre à laisser tomber l'affaire. Quand il la voit pour la première fois il tombe violemment sous son charme.","po":"/exKsz6d4TlcIZA34KwwIIycJOgv.jpg"},{"m":"movie","i":157336,"t":"Interstellar","y":"2014","g":[12,18,878],"k":[2735,840,1125,648,2736,2737,448,650,1774,302,2738,169,2739,2740,2741,2742,2743,961,1595,1389,575,704,2744,1597,2660,619,2745,2671,620],"cr":[525],"ca":[10297,1813,3895,83002,1893],"rc":[299534,687163],"p":"p4","bz":0.9959798994974876,"q":1.0,"n":41430,"v":8.49,"rt":169,"se":null,"tg":"L’Homme est né sur Terre, rien ne l’oblige à y mourir.","ov":"Dans un futur proche, face à une Terre exsangue, un groupe d’explorateurs utilise un vaisseau interstellaire pour franchir un trou de ver permettant de parcourir des distances jusque‐là infranchissables. Leur but : trouver un nouveau foyer pour l’humanité.","po":"/1pnigkWWy8W032o9TKDneBa3eVK.jpg"},{"m":"movie","i":166428,"t":"Dragons 3 : Le monde caché","y":"2019","g":[16,10751,12],"k":[187,519,480,506,1058,175 ude au conservatoire de Manhattan où il s’entraîne avec acharnement. Il a pour objectif d’intégrer le fleuron des orchestres dirigé par Terence Fletcher, professeur féroce et intraitable. Lorsque celui-ci le repère enfin, Andrew se lance, sous sa direction, dans la quête de l’excellence…","po":"/3XriEpTdnplQRzyphAC0cu3emns.jpg"},{"m":"movie","i":245891,"t":"John Wick","y":"2014","g":[28,53],"k":[2838,74,462,1760,395,2839,369,1296,2840],"cr":[40644],"ca":[6384,6283,71586,5293,68763],"rc":[615457,603692],"p":"p4","bz":0.46834170854271356,"q":0.01507537688442211,"n":21443,"v":7.464,"rt":101,"se":null,"tg":"Surtout ne l’énervez pas.","ov":"Depuis la mort de sa femme bien‐aimée, John Wick passe ses journées à retaper sa Ford Mustang de 1969, avec pour seule compagnie sa chienne Daisy. Il mène une vie sans histoire, jusqu’à ce qu’un malfrat sadique nommé Iosef Tarasof remarque sa voiture. John refuse de la lui vendre. Iosef n’acceptant pas qu’on lui résiste, s’introduit chez John avec deux complices pour voler la Mustang, et tuer sauvagement Daisy… John remonte la piste de Iosef jusqu’à New York. Un ancien contact, Aurelio, lui apprend que le malfrat est le fils unique d’un grand patron de la pègre, Viggo Tarasof. La rumeur se répand rapidement dans le milieu : le légendaire tueur cherche Iosef. Viggo met à prix la tête de John : quiconque l’abattra touchera une énorme récompense. John a désormais tous les assassins de New York aux trousses.","po":"/7yCzmVL0BI1aSvzgN3jCtXLtyFR.jpg"},{"m":"movie","i":246741,"t":"Vampires en toute intimité","y":"2014","g":[35,27],"k":[127,648,2841,2842,260,2843,31,210,2725,1797,2844,2845,2846,449,2847,1549,2848,165],"cr":[55936,55934],"ca":[55936,55934,586951,1286794,1286796],"rc":[],"p":"p4","bz":0.20904522613065327,"q":0.3015075376884422,"n":4105,"v":7.542,"rt":82,"se":null,"tg":"Dans l'ombre de l'obscurité de la nuit","ov":"Les vampires Viago (379 ans), Deacon (183 ans), Vladislav (862 ans) et Peter (8 000 ans) partagent un appartement à Wellington, en Nouvelle-Zélande. Malheureusement pour eux, et à cause de leur irrépressible besoin de s’alimenter en sang, ils ont du mal à se faire des amis ou à maintenir en vie des relations qui leur permettraient de fréquenter les établissements branchés de la ville. Sans vie sociale, ces créatures de la nuit arriveront-elles à surmonter leurs différences et s’adapter ainsi au monde moderne ?","po":"/roTYpIqLlzrGcGCEit4tNhKKMdw.jpg"},{"m":"movie","i":258480,"t":"Carol","y":"2015","g":[10749,18],"k":[1864,480,2849,690,18,323,2182,1974,481,744,2850,383,533,1543,1702,2318,724,2851,153,2852,119,728,1097,2853,469,2854,2603],"cr":[16863],"ca":[112,108916,3497,496470,34490],"rc":[],"p":"p4","bz":0.1577889447236181,"q":0.19095477386934673,"n":4050,"v":7.488,"rt":118,"se":null,"tg":"Certaines personnes changent votre vie pour toujours.","ov":"Dans le New York des années 1950, Therese,  jeune employée d’un grand magasin de Manhattan, fait la connaissance d’une cliente distinguée, Carol, femme séduisante, prisonnière d'un mariage peu heureux. À l’étincelle de la première rencontre succède rapidement un sentiment plus profond. Les deux femmes se retrouvent bientôt prises au piège entre les conventions et leur attirance mutuelle.","po":"/jD3HZaNeolV5Y1cAoQP1Wkd233f.jpg"},{"m":"movie","i":260513,"t":"Les Indestructibles 2","y":"2018","g":[28,12,16,10751],"k":[187,2707,140,2855,2856,353,595,89,476,477,576,418,549],"cr":[7087],"ca":[8977,18686,59361,1852182,2229],"rc":[1506560,177572],"p":"p4","bz":0.44120603015075377,"q":0.020100502512562814,"n":14003,"v":7.452,"rt":118,"se":null,"tg":"Sauver le monde, c’est une affaire de famille","ov":"Les Parr reprennent du service ! Alors qu'Hélène est appelée pour redorer le blason des super-héros, Bob découvre la vie \"normale\" avec Violette, Flèche et le bébé Jack-Jack, dont les super pouvoirs sont sur le point de se révéler. Leur mission tourne court lorsqu'un nouveau méchant débarque avec un plan brillant. Mais les Parr ne fuient jamais les défis, surtout avec Frozone à leurs côtés.","po":"/Apish2YD3QIAepzxZ96VLkqEZo3.jpg"},{"m":"movie","i":263115,"t":"Logan","y":"2017","g":[28,18,878],"k":[2857,419,1149,448,1082,1115,1775,796,1536,2858,2677,2859,422,469,2860,89,328,476,477,2861],"cr":[366],"ca":[6968,1464650,2387,65421,467645],"rc":[],"p":"p4","bz":0.7427135678391961,"q":0.628140703517588,"n":20931,"v":7.821,"rt":138,"se":null,"tg":"Son heure est venue","ov":"Dans un futur proche, un certain Logan, épuisé de fatigue, s’occupe d’un Professeur X souffrant, dans un lieu gardé secret à la frontière Mexicaine. Mais les tentatives de Logan pour se retrancher du monde et rompre avec son passé vont s’épuiser lorsqu’une jeune mutante traquée par de sombres individus va se retrouver soudainement face à lui.","po":"/sUYRG0ZGck9SYvMkTNcNibdE8M6.jpg"},{"m":"movie","i":264644,"t":"Room","y":"2015","g":[18,53],"k":[18,2862,2863,2864,744,1268,74,2003,2865,2487,2866,783,46,352,2867],"cr":[83281],"ca":[60073,1277188,11148,144160,64712],"rc":[860508],"p":"p4","bz":0.5587939698492462,"q":0.7839195979899497,"n":9883,"v":7.985,"rt":118,"se":null,"tg":"L'amour ne connait aucunes frontières.","ov":"Jack, 5 ans, vit seul avec sa mère, Ma. Elle lui apprend à jouer, à rire et à comprendre le monde qui l’entoure. Un monde qui commence et s’arrête aux murs de leur chambre, où ils sont retenus prisonniers, le seul endroit que Jack ait jamais connu. L’amour de Ma pour Jack la pousse à tout risquer pour offrir à son fils une chance de s’échapper et de découvrir l’extérieur, une aventure à laquelle il n’était pas préparé.","po":"/1pcPCKSNnyAtR3f3x5GKNqqu7Wn.jpg"},{"m":"movie","i":264660,"t":"Ex Machina","y":"2015","g":[18,878],"k":[838,840,2160,2495,2868,1573,2869,2870,1433,2871,1150,31,2872,2873,629,2874,783,2875,2876,2877,1240,884,2878,2879,844,1939,2880,91,2881,2882,2883],"cr":[2036],"ca":[93210,227454,25072,1457238,17199],"rc":[335984,500664],"p":"p4","bz":0.4693467336683418,"q":0.16080402010050251,"n":14673,"v":7.571,"rt":108,"se":null,"tg":"Rien n'est plus humain que la volonté de survivre","ov":"Caleb, 24 ans, est programmeur de l'une des plus importantes entreprise d'informatique au monde. Lorsqu'il gagne un concours pour passer une semaine dans un lieu retiré en montagne appartenant à Nathan, le PDG solitaire de son entreprise, il découvre qu'il va en fait devoir participer à une étrange et fascinante expérience dans laquelle il devra interagir avec la première intelligence artificielle au monde qui prend la forme d'un superbe robot féminin.","po":"/gXUnFIZdLsGnZp2AxKjQIVm5jEM.jpg"},{"m":"movie","i":265195,"t":"Les Nouveaux Sauvages","y":"2014","g":[18,53,35],"k":[2192,177,648,35,2884,369,2885,2886],"cr":[591600],"ca":[69310,19803,141455,1457004,99113],"rc":[],"p":"p4","bz":0.3668341708542714,"q":0.6482412060301508,"n":3905,"v":7.867,"rt":122,"se":null,"tg":"Nous pouvons tous perdre le contrôle","ov":"L'inégalité, l'injustice et l'exigence auxquelles nous expose le monde où l'on vit provoquent du stress et des dépressions chez beaucoup de gens. Certains craquent. « Les Nouveaux Sauvages » est un film sur eux.","po":"/AfIpiMolcWnLYXGapu8xwbdmm2S.jpg"},{"m":"movie","i":266856,"t":"Une merveilleuse histoire du temps","y":"2014","g":[18,10749],"k":[519,2887,2574,8,278,2888,2889,114,76,2488,2890,2891],"cr":[76998],"ca":[37632,72855,23458,1639,16358],"rc":[296096],"p":"p4","bz":0.5437185929648242,"q":0.6180904522613065,"n":11309,"v":7.821,"rt":123,"se":null,"tg":"L'histoire extraordinaire de Jane et Stephen Hawking.","ov":"À l’âge de 21 ans, Stephen Hawking est un brillant étudiant en Cosmologie à l’Université de Cambridge, passionné par les mystères de l’univers. De nouveaux horizons s’ouvrent lorsqu’il tombe amoureux d’une étudiante en arts, Jane Wilde. Mais le jeune homme se heurte alors à un diagnostic médical sans appel qui vient bouleverser ce bonheur. Alors que ses jours sont comptés, l’amour et le soutien sans faille de Jane, vont lui donner la force de s’attaquer aux recherches sur ce qu’il a désormais de plus précieux : le temps. Ensemble, ils défient l’impossible, pour aller au-delà de ce qu’ils auraient pu imaginer : le vingt et unième siècle.","po":"/ab7iTHrBR0Ik1tJnLW3JauLImH9.jpg"},{"m":"movie","i":269149,"t":"Zootopie","y":"2016","g":[16,12,10751,35],"k":[187,127,2892,1356,1153,1093,1197,2707,2893,2894,2895,2896,2897,1698,1252,450,2898,2899,570,2855,2900,2901,463,2902,806,2903,2904,2905,369,2906,212,2108,2907,549,2756],"cr":[76595,165787],"ca":[417,23532,17605,213001,41565],"rc":[1084242],"p":"p4","bz":0.7095477386934673,"q":0.5326633165829145,"n":18597,"v":7.765,"rt":109,"se":null,"tg":"Bienvenue dans la jungle urbaine.","ov":"Avec ses quartiers comme la très chic Place du Sahara ou le glacial Toundraville, la métropole Zootopie, où ne vivent que des mammifères, est un melting pot où toutes les espèces cohabitent. Qu’on soit un énorme éléphant ou une minuscule musaraigne, tout le monde y a sa place. Mais quand l’optimiste agent Judy Hopps arrive en ville, elle découvre qu’être le premier lapin dans la police, au milieu d'animaux costauds, n’est pas si simple. Pour faire ses preuves, elle décide de résoudre une enquête, même si pour cela, elle doit faire équipe avec Nick Wilde, un renard beau parleur et roi de l’arnaque. Certaines séquences ou certains motifs lumineux clignotants sont susceptibles d'affecter les téléspectateurs photosensibles.","po":"/5Fy3e9nRhPYweqnrzFUCHmJ4Grc.jpg"},{"m":"movie","i":271110,"t":"Captain America : Civil War","y":"2016","g":[12,28,878],"k":[127,419,464,540,89,793,477,2908,2909,2910],"cr":[19272,19271],"ca":[16828,3223,1245,60898,53650],"rc":[100402,447365,283995,634649,299536,284053,24428],"p":"p4","bz":0.542713567839196,"q":0.0,"n":24679,"v":7.454,"rt":148,"se":null,"tg":"La division entraîne la chute","ov":"Steve Rogers est désormais à la tête des Avengers, dont la mission est de protéger l’humanité. À la suite d’une de leurs interventions qui a causé d’importants dégâts collatéraux, le gouvernement décide de mettre en place un organisme de commandement et de supervision. Cette nouvelle donne provoque une scission au sein de l’équipe : Steve Rogers reste attaché à sa liberté de s’engager sans ingérence gouvernementale, tandis que d’autres se rangent derrière Tony Stark, qui contre toute attente, décide de se soumettre au gouvernement…","po":"/i2nc9IAP1xRWoa3MgeR7ldsshkV.jpg"},{"m":"movie","i":273248,"t":"Les Huit Salopards","y":"2015","g":[18,9648,37],"k":[308,626,2911,702,2912,2913,2914,2915,2556,2916,2917,2918,1653,2190],"cr":[138],"ca":[2231,6856,10431,27740,76961],"rc":[281957],"p":"p4","bz":0.6361809045226131,"q":0.5125628140703518,"n":15692,"v":7.755,"rt":180,"se":null,"tg":"Personne ne vient ici sans raison.","ov":"Après la Guerre de Sécession, huit voyageurs se retrouvent coincés dans un refuge au milieu des montagnes. Alors que la tempête s'abat au-dessus du massif, ils réalisent qu'ils n'arriveront peut-être pas à rallier Red Rock comme prévu…","po":"/kV6ogsiIYzV2qZ43bLuDKuEAIR.jpg"},{"m":"movie","i":277216,"t":"N.W.A : Straight Outta Compton","y":"2015","g":[18,10402,36],"k":[517,2717,2919,8,2920,2921,461,2922,464,2923,2924,2925,462,2926,2927,2487,114,2928,2929,803,726,2202,1539,2764,1097,2930,1861,2931,2932,2933,2934,2568,2935,1486,2936,2937,2938,469,528,2939,2940,2941],"cr":[37932],"ca":[1371398,1154054,1115984,55091,83860],"rc":[],"p":"p4","bz":0.3316582914572865,"q":0.542713567839196,"n":4323,"v":7.771,"rt":146,"se":null,"tg":"Le groupe le plus dangereux du monde.","ov":"En 1987, cinq jeunes hommes exprimaient leur frustration et leur colère pour dénoncer les conditions de vie de l'endroit le plus dangereux de l’Amérique, avec l'arme la plus puissante qu'ils possédaient : leur musique. Voici la véritable histoire de ces rebelles, armés uniquement de leur parole, de leur démarche assurée et de leur talent brut, qui ont résisté aux autorités qui les opprimaient. Ils ont ainsi formé le groupe de rappeur des N.W.A. en dénonçant la réalité de leur quartier. Leur voix a alors déclenché une révolution sociale qui résonne encore aujourd'hui.","po":"/kyBVUPrCM2QSCZw6paGs0MLAufL.jpg"},{"m":"movie","i":277834,"t":"Vaiana, la légende du bout du monde","y":"2016","g":[12,35,10751,16],"k":[187,519,127,633,2707,191,100,634,635,636,637,198,2942,640,203,641,2943,642,422,643,2944,1619,644,646,549,957],"cr":[15811,15810],"ca":[1564846,18918,15298,7242,55936],"rc":[1108427,991494],"p":"p4","bz":0.35979899497487433,"q":0.1507537688442211,"n":14079,"v":7.566,"rt":108,"se":null,"tg":"L’océan vous appelle.","ov":"Il y a 3 000 ans, les plus grands marins du monde parcouraient le vaste océan Pacifique, à la découverte des nombreuses îles de l’Océanie. Puis, pendant un millénaire, ils cessèrent de voyager, et nul ne sait pourquoi. Walt Disney Animation Studios nous offre Vaiana, La Légende du bout du monde, l'histoire d'une jeune fille aventureuse qui prend la mer pour sauver son peuple. Au cours de son voyage, Vaiana rencontre le puissant demi-dieu Maui qui la guidera dans sa quête pour devenir une experte de la navigation. Ensemble, ils entreprennent un voyage rocambolesque et affrontent des monstres gigantesques et bien des dangers. Vaiana va accomplir la mission de ses ancêtres et découvrir ce qu’elle a toujours cherché : son identité.","po":"/u9rrmuYW9jCmFn3zN0RX9vhzRKp.jpg"},{"m":"movie","i":281957,"t":"The Revenant","y":"2015","g":[37,18,12],"k":[308,1044,1356,2192,18,8,2546,2945,1866,2946,2947,2948,2949,509,2950,2951,2952,2953,2556,395,2954,2955,1097,996,332,369,2956,266,1874,2957,163,268,99,2958,2959,1875,2960],"cr":[223],"ca":[6193,2524,93210,93491,1560185],"rc":[273248],"p":"p4","bz":0.5306532663316583,"q":0.08542713567839195,"n":19803,"v":7.541,"rt":157,"se":null,"tg":"Laissé pour mort. Habité par la vengeance.","ov":"Dans une Amérique profondément sauvage, le trappeur Hugh Glass est sévèrement blessé et laissé pour mort par un traître de son équipe, John Fitzgerald. Avec sa seule volonté pour unique arme, Glass doit affronter un environnement hostile, un hiver brutal et des tribus guerrières, dans une inexorable lutte pour sa survie, portée par un intense désir de vengeance.","po":"/AsDto68FNWNXD15Ov0yMXASJiSB.jpg"},{"m":"movie","i":283995,"t":"Les Gardiens de la Galaxie Vol. 2","y":"2017","g":[878,12,28],"k":[127,762,419,464,486,539,540,89,575,477],"cr":[15218],"ca":[73457,8691,543530,12835,51329],"rc":[447365,271110,118340,299534,100402,24428,299536,969681,454639,634649],"p":"p4","bz":0.5989949748743719,"q":0.22613065326633167,"n":23555,"v":7.609,"rt":138,"se":null,"tg":"N'importe qui peut sauver la galaxie une fois.","ov":"Avec en toile de fond l’Awesome Mixtape #2, Les Gardiens de la Galaxie Vol. 2 poursuit les aventures de l’équipe alors qu’ils traversent les confins du cosmos. Les Gardiens doivent se battre pour que leur nouvelle famille reste ensemble tandis qu’ils cherchent à percer le mystère de la véritable filiation de Star-Lord. De vieux ennemis deviennent de nouveaux alliés et des personnages appréciés des fans, issus des comics, viennent en aide à nos héros alors que l’Univers Cinématographique Marvel continue de se développer.","po":"/brgkPEPQJNGLuKRy8omRTcDfDuL.jpg"},{"m":"movie","i":284053,"t":"Thor : Ragnarok","y":"2017","g":[28,12,35,878],"k":[127,470,419,360,464,1154,2855,540,710,2961,2962,1782,89,477],"cr":[55934],"ca":[74568,103,91606,112,17605],"rc":[283995,447365,271110,299536,118340,100402,127585],"p":"p4","bz":0.6020100502512563,"q":0.1457286432160804,"n":22593,"v":7.579,"rt":130,"se":null,"tg":"Pas de marteau ? Pas de problème !","ov":"Thor est emprisonné de l’autre côté de l’univers sans son puissant marteau et se retrouve engagé dans une course contre le temps pour rejoindre Asgard et arrêter Ragnarok – la destruction de son monde natal et la fin de la civilisation Asgardienne – des mains d’une toute nouvelle menace, l’impitoyable Hela. Mais d’abord, il doit survivre à une compétition meurtrière de gladiateurs qui l’oppose à son ancien allié et compagnon Avenger – l’Incroyable Hulk !","po":"/mAA8RXkgF87jSWWMSf6hgLl73mk.jpg"},{"m":"movie","i":284293,"t":"Still Alice","y":"2014","g":[18],"k":[2485,2963,18,2964,140,2965,201,143,25],"cr":[82337,82335],"ca":[1231,7517,83222,35236,7447],"rc":[600354],"p":"p4","bz":0.1658291457286432,"q":0.2562814070351759,"n":3361,"v":7.5,"rt":101,"se":null,"tg":null,"ov":"Mariée, heureuse et mère de trois grands enfants, Alice Howland est un professeur de linguistique renommé. Mais lorsqu’elle commence à oublier ses mots et qu’on lui diagnostique les premiers signes de la maladie d’Alzheimer, les liens entre Alice et sa famille sont mis à rude épreuve.","po":"/3z5UZcKnoItfBkA1J84yexW65gc.jpg"},{"m":"movie","i":286217,"t":"Seul sur Mars","y":"2015","g":[878,18,12],"k":[2966,127,1125,18,2967,2968,464,2969,2970,783,2741,2971,575,2660,598,1886,163],"cr":[578],"ca":[1892,83002,41091,8447,454],"rc":[118340,24428,687163,447365,127585],"p":"p4","bz":0.7015075376884423,"q":0.4321608040201005,"n":21929,"v":7.709,"rt":144,"se":null,"tg":"Les secours sont à 225 millions de kilomètres.","ov":"Au cours d’une mission spatiale habitée sur Mars, et à la suite d’un violent orage, l’astronaute Mark Watney est laissé pour mort et abandonné sur place par son équipage. Mais Watney a survécu et se retrouve seul sur cette planète hostile. Avec de maigres provisions, il ne doit compter que sur son ingéniosité, son bon sens et son intelligence pour survivre et trouver un moyen d’alerter la Terre qu’il est encore vivant. À des millions de kilomètres de là, la NASA et une équipe de scientifiques internationaux travaillent sans relâche pour ramener « le Martien » sur terre, pendant que, en parallèle, ses coéquipiers tentent secrètement d’organiser une audacieuse voire impossible mission de sauvetage.","po":"/51CqiKVStZ2YPx64iPs3LDDiQnt.jpg"},{"m":"movie","i":290098,"t":"Mademoiselle","y":"2016","g":[53,18,10749],"k":[149,18,54,2638,1253,494,330,2972,2973,2974,1237,2975,2318,724,153,2976,179,804,1508,2977,29 r.","po":"/yxQ84WS0zaeMBkWsbJcO8GlQEKf.jpg"},{"m":"movie","i":296096,"t":"Avant toi","y":"2016","g":[18,10749],"k":[2983,800,18,2224,2984,1268,1331,2985,36,22,338,740,1275,2770,2986,846],"cr":[1096867],"ca":[1223786,237455,47627,4391,74056],"rc":[222935],"p":"p4","bz":0.7085427135678393,"q":0.7437185929648241,"n":13640,"v":7.932,"rt":110,"se":null,"tg":"Vivez hardiment.","ov":"Une charmante petite ville de l'Angleterre rurale. Si elle est originale et artiste dans l'âme, Louisa «Lou» Clark, 26 ans, n'a aucune ambition particulière. Elle se contente d'enchaîner les boulots pour permettre à ses proches de joindre les deux bouts. Jeune et riche banquier, Will Traynor était un garçon plein d'audace et d'optimisme jusqu'à ce qu'il se retrouve paralysé, suite à un accident survenu deux ans plus tôt. Devenu cynique, il a renoncé à tout et n'est plus que l'ombre de lui-même. Autant dire que ces deux-là auraient pu ne jamais se rencontrer. Mais lorsque Lou accepte de travailler comme aide-soignante auprès de Will, elle est bien décidée à lui redonner goût à la vie. Et peu à peu, les deux jeunes gens s'éprennent passionnément l'un de l'autre. La force de leur amour pourra-t-elle survivre à leur destin qui semble inexorable ?","po":"/ooKtRBvopA78WkI7UJytG0bOQuK.jpg"},{"m":"movie","i":299534,"t":"Avengers : Endgame","y":"2019","g":[12,878,28],"k":[763,235,419,169,540,89,2011,1597,477,1172,713,1766,619],"cr":[19272,19271],"ca":[3223,16828,103,74568,1245],"rc":[283995,447365,299536,83533,271110,24428],"p":"p4","bz":0.9738693467336684,"q":0.9597989949748744,"n":28958,"v":8.246,"rt":181,"se":null,"tg":"Rien ne peut vous préparer pour la fin.","ov":"Après leur défaite face au Titan Thanos qui dans le film précédent s'est approprié toutes les pierres du Gant de l'infini, les Avengers et les Gardiens de la Galaxie ayant survécu à son claquement de doigts qui a pulvérisé « la moitié de toute forme de vie dans l'Univers », Captain America, Thor, Bruce Banner, Natasha Romanoff, War Machine, Tony Stark, Nébula et Rocket, vont essayer de trouver une solution pour ramener leurs coéquipiers disparus et vaincre Thanos en se faisant aider par Ronin alias Clint Barton, Captain Marvel et Ant-Man.","po":"/wF7jv3x51hXgkl7t5KHePuRjXc8.jpg"},{"m":"movie","i":299536,"t":"Avengers : Infinity War","y":"2018","g":[12,28,878],"k":[127,419,2987,134,286,511,2988,540,2493,575,476,477,1172],"cr":[19271,19272],"ca":[3223,16828,74568,16851,103],"rc":[447365,118340,271110,24428,283995,299534,100402,127585,284053],"p":"p4","bz":0.9809045226130654,"q":0.9698492462311558,"n":33116,"v":8.245,"rt":149,"se":null,"tg":"Où serez-vous, quand tout sera fini ?","ov":"Les Avengers et leurs alliés devront être prêts à tout sacrifier pour neutraliser le redoutable Thanos avant que son attaque éclair ne conduise à la destruction complète de l’univers.","po":"/hSfuKPtyEryeFzapZ8UgZd4aESu.jpg"},{"m":"movie","i":301528,"t":"Toy Story 4","y":"2019","g":[10751,35,16,12],"k":[187,2989,2990,555,2991,2707,589,2147,2992,2993,464,31,595,597,89,603],"cr":[84496],"ca":[31,12898,8873,25147,298410],"rc":[1084244],"p":"p4","bz":0.42311557788944726,"q":0.035175879396984924,"n":11060,"v":7.463,"rt":100,"se":null,"tg":"Que la fête commence !","ov":"Woody a toujours privilégié la joie et le bien‐être de ses jeunes propriétaires – Andy puis Bonnie – et de ses compagnons, n’hésitant pas à prendre tous les risques pour eux, aussi inconsidérés soient‐ils. L’arrivée de Forky, un nouveau jouet qui ne veut pas en être un dans la chambre de Bonnie, met toute la petite bande en émoi. C’est le début d’une grande aventure et d’un extraordinaire voyage pour Woody et ses amis. Le cowboy va découvrir à quel point le monde peut être vaste pour un jouet…","po":"/qWtRA6rfUNm81A7ITDrq6WkfCNy.jpg"},{"m":"movie","i":306819,"t":"The Danish Girl","y":"2015","g":[18],"k":[859,2505,800,18,771,2994,2628,2995,2153,622,335,153,1780,1585,109,2996,2997],"cr":[70500],"ca":[37632,227454,73381,17064,8197],"rc":[152532],"p":"p4","bz":0.2150753768844221,"q":0.12060301507537688,"n":6025,"v":7.5,"rt":120,"se":null,"tg":"Trouver le courage d'être soi-même.","ov":"Gerda et Einar Wegener, couple fusionnel, partagent la même passion pour la peinture. Gerda a du mal à vendre ses oeuvres tandis qu'Einar a beaucoup de succès avec ses paysages. Un jour, la jeune femme demande à son mari de jouer les modèles féminins. Einar s'exécute et découvre, bouleversé, qu'il adore ça…","po":"/3JTboPOsj0GGaPtBTKm8W0MXfof.jpg"},{"m":"movie","i":309809,"t":"Le Petit Prince","y":"2015","g":[12,16,14,10751],"k":[187,888,1683,448,2620,2998,2999,3000,3001,1097,3002,1206,3003,3004,3005],"cr":[57741],"ca":[1397911,851784,1229,53714,8293],"rc":[1184918,501929,1117857],"p":"p4","bz":0.24723618090452265,"q":0.4020100502512563,"n":3045,"v":7.6,"rt":106,"se":null,"tg":"C’est l’histoire d’une histoire.","ov":"C’est l’histoire d’une histoire. C’est l’histoire d’une petite fille, intrépide et curieuse, qui vit dans un monde d’adultes. C’est l’histoire d’un aviateur, excentrique et facétieux, qui n’a jamais vraiment grandi. C’est l’histoire du Petit Prince qui va les réunir dans une aventure extraordinaire.","po":"/yIGmrOYLXsi51YbelSwqfFPkcsO.jpg"},{"m":"movie","i":313297,"t":"Kubo et l'armure magique","y":"2016","g":[16,12,10751],"k":[187,3006,3007,2511,511,352,3008,2384,3004,3009],"cr":[1033661],"ca":[1050248,6885,10297,30585,5469],"rc":[1117857,309809,568124,1465063],"p":"p4","bz":0.27236180904522617,"q":0.37185929648241206,"n":3951,"v":7.6,"rt":101,"se":null,"tg":"Une aventure épique. Trois héros inattendus.","ov":"Sur les rives escarpées d’un Japon fantasmagorique, un jeune garçon nommé Kubo vit dans une grotte, en haut d’une falaise. S’il a l’air d’un vagabond dépenaillé, il est pourtant aussi attentionné qu’intelligent et vit une existence modeste de conteur de rue. Jour après jour, il régale des histoires les plus folles, les habitants de ce petit village de pêcheurs, en les illustrant de personnages en origami qui prennent littéralement vie au son de son Shamisen (un instrument musical magique). Hosato, Hashi et Kameyo, sont ses spectateurs les plus fidèles. Le soir, le jeune garçon rejoint sa mère qui semble sombrer dans une mystérieuse transe entre le lever et le coucher du soleil.","po":"/vbVomBFh965jxqIa64CnCdg6PVX.jpg"},{"m":"movie","i":313369,"t":"La La Land","y":"2016","g":[35,18,10749],"k":[520,3010,2290,716,719,3011,744,3012,2868,1212,238,533,3013,303,2832,3014,803,3015,640,3016,932,3017,3018,2133,26,3019,3020,2770],"cr":[136495],"ca":[30614,54693,113461,14892,168877],"rc":[614945],"p":"p4","bz":0.7668341708542714,"q":0.6984924623115578,"n":18578,"v":7.894,"rt":128,"se":null,"tg":"Voici les fous qui rêvent.","ov":"Au cœur de Los Angeles, une actrice en devenir prénommée Mia sert des cafés entre deux auditions. De son côté, Sebastian, passionné de jazz, joue du piano dans des clubs miteux pour assurer sa subsistance. Tous deux sont bien loin de la vie rêvée à laquelle ils aspirent… Le destin va réunir ces doux rêveurs, mais leur coup de foudre résistera-t-il aux tentations, aux déceptions, et à la vie trépidante d’Hollywood ?","po":"/5KIj6aioW1UtUT1IV0qqW5iZbNH.jpg"},{"m":"movie","i":314365,"t":"Spotlight","y":"2015","g":[18,36],"k":[3021,3022,8,2438,2154,3023,271,3024,522,3025,450,3026,2120,112,335,3027,116,832,684,686,153,3028,121,814,1066,3029,69,3030,99,2311,3031],"cr":[17867],"ca":[103,2232,53714,23626,21134],"rc":[551332],"p":"p4","bz":0.4914572864321608,"q":0.6080402010050251,"n":9018,"v":7.812,"rt":129,"se":null,"tg":"Briser le silence de l'Église.","ov":"Une équipe de journalistes d’investigation, baptisée Spotlight, a enquêté pendant 12 mois sur des suspicions d’abus sexuels au sein d’une des institutions les plus anciennes et les plus respectées au monde. L’enquête révèlera que L’Eglise Catholique a protégé pendant des décennies les personnalités religieuses, juridiques et politiques les plus en vue de Boston, et déclenchera par la suite une vague de révélations dans le monde entier.","po":"/bY4K4gkDjJCNsNLHhdDPApTZiE.jpg"},{"m":"movie","i":315162,"t":"Le Chat Potté 2 : la dernière quête","y":"2022","g":[16,12,14,35,10751],"k":[187,127,716,1698,1082,562,3032,3033,61,76,1017,89,328,3034,3035],"cr":[1450348],"ca":[3131,3136,210172,52583,1373737],"rc":[927254,1022789,1117857,1084242],"p":"p4","bz":0.734673366834171,"q":0.9246231155778895,"n":9285,"v":8.22,"rt":102,"se":null,"tg":"La légende ne meurt jamais.","ov":"Le Chat Potté découvre que sa passion pour l'aventure et son mépris du danger ont fini par lui coûter cher : il a épuisé huit de ses neuf vies, et en a perdu le compte au passage. Afin de retomber sur ses pattes notre héros velu se lance littéralement dans la quête de sa vie. Il s'embarque dans une aventure épique aux confins de la Forêt Sombre afin de dénicher la mythique Étoile à vœu, seule susceptible de lui rendre ses vies perdues. Mais quand il ne vous en reste qu’une, il faut savoir faire profil bas, se montrer prudent et demander de l’aide. C’est ainsi qu’il se tourne vers son ancienne partenaire et meilleure ennemie de toujours : l’ensorcelante Kitty Pattes De Velours. Le Chat Potté et la belle Kitty vont être aidés dans leur quête, à leur corps bien défendant, par Perro, un corniaud errant et galeux à la langue bien pendue et d’une inaltérable bonne humeur.","po":"/kO35BwoKHyP1VRulxZJVeEl5dvS.jpg"},{"m":"movie","i":316029,"t":"The Greatest Showman","y":"2017","g":[18],"k":[626,3036,506,8,278,3037,771,2155,3038,3039,640,3040,1294,2935,3041,3042,363,3043],"cr":[1276373],"ca":[6968,29222,1812,933238,505710],"rc":[936075],"p":"p4","bz":0.5849246231155779,"q":0.6582914572864321,"n":10274,"v":7.852,"rt":104,"se":null,"tg":"Tout commence par un rêve.","ov":"The Greatest Showman célèbre la naissance du show‐business et l’émerveillement que l’on éprouve lorsque les rêves deviennent réalité. Inspirée par l’ambition et l’imagination de P.T Barnum, voici l’histoire d’un visionnaire parti de rien qui a créé un spectacle devenu un phénomène planétaire.","po":"/sZbtOB5mpGSUy8aW6t4O3eF1fPf.jpg"},{"m":"movie","i":324786,"t":"Tu ne tueras point","y":"2016","g":[18,36,10752],"k":[518,519,1006,8,3044,1831,278,3045,3046,3047,509,539,2511,3048,3049,3050,3051,1841,3052,792,3053,3054,2209,3055,877],"cr":[2461],"ca":[37625,65731,4937,20374,972356],"rc":[228150],"p":"p4","bz":0.835175879396985,"q":0.9296482412060302,"n":15384,"v":8.192,"rt":139,"se":null,"tg":"Un des plus grand héros de guerre n'a jamais tiré une balle.","ov":"Quand la Seconde Guerre mondiale a éclaté, Desmond, un jeune américain, s’est retrouvé confronté à un dilemme: comme n’importe lequel de ses compatriotes, il voulait servir son pays, mais la violence était incompatible avec ses croyances et ses principes moraux. Il s’opposait ne serait-ce qu’à tenir une arme et refusait d’autant plus de tuer. Il s’engagea tout de même dans l’infanterie comme médecin. Son refus d’infléchir ses convictions lui valut d’être rudement mené par ses camarades et sa hiérarchie. Cependant, c'est armé de sa seule foi qu’il est entré dans l’enfer de la guerre pour en devenir l’un des plus grands héros. Lors de la bataille d’Okinawa sur l’imprenable falaise de Maeda, il a réussi à sauver des dizaines de vies, seul sous le feu de l’ennemi, ramenant en sûreté du champ de bataille, un à un, les soldats blessés.","po":"/zyxSZvaA7mU7mwnO1lR2cXUdQdV.jpg"},{"m":"movie","i":324857,"t":"Spider-Man : New Generation","y":"2018","g":[16,28,12,878],"k":[127,1320,419,477],"cr":[936670,151007,59918],"ca":[587506,543505,130640,932967,226366],"rc":[284053],"p":"p4","bz":0.9055276381909548,"q":0.9849246231155779,"n":17988,"v":8.402,"rt":117,"se":null,"tg":"Découvrez un univers où ils sont plus d'un à porter le masque","ov":"Spider-Man : New Generation suit les aventures de Miles Morales, un adolescent afro-américain et portoricain qui vit à Brooklyn et s’efforce de s’intégrer dans son nouveau collège à Manhattan. Mais la vie de Miles se complique quand il se fait mordre par une araignée radioactive et se découvre des super-pouvoirs : il est désormais capable d’empoisonner ses adversaires, de se camoufler, de coller littéralement aux murs et aux plafonds ; son ouïe est démultipliée... Dans le même temps, le plus redoutable cerveau criminel de la ville, le Caïd, a mis au point un accélérateur de particules nucléaires capable d’ouvrir un portail sur d’autres univers. Son invention va provoquer l’arrivée de plusieurs autres versions de Spider-Man dans le monde de Miles, dont un Peter Parker plus âgé, Spider-Gwen, Spider-Man Noir, Spider-Cochon et Peni Parker, venue d’un dessin animé japonais.","po":"/3bSWpsB2PqoTrJhW9cM6tJMDxIm.jpg"},{"m":"movie","i":329865,"t":"Premier Contact","y":"2016","g":[18,878,9648],"k":[762,3056,3057,410,3058,744,3059,3060,570,3061,2725,1419,3062,3063,3064,3065,276,78,1143,1595,2660,3066,2671,2603],"cr":[137427],"ca":[9273,17604,2178,72873,225411],"rc":[522402,157336,1236153],"p":"p4","bz":0.6150753768844222,"q":0.32160804020100503,"n":19992,"v":7.636,"rt":111,"se":null,"tg":"Pourquoi sont-ils ici ?","ov":"Lorsque de mystérieux vaisseaux venus du fond de l’espace surgissent un peu partout sur Terre, une équipe d’experts est rassemblée sous la direction de la linguiste Louise Banks afin de tenter de comprendre leurs intentions.  Face à l’énigme que constituent leur présence et leurs messages mystérieux, les réactions dans le monde sont extrêmes et l’humanité se retrouve bientôt au bord d’une guerre absolue. Louise Banks et son équipe n’ont que très peu de temps pour trouver des réponses. Pour les obtenir, la jeune femme va prendre un risque qui pourrait non seulement lui coûter la vie, mais détruire le genre humain…","po":"/mSgYBWMybY9Ug4ZnCGsttPIjUx7.jpg"},{"m":"movie","i":330459,"t":"Rogue One : A Star Wars Story","y":"2016","g":[28,12,878],"k":[3067,3057,3068,570,865,3069,14,844,3070,705,1597,3071,2660,328,3072],"cr":[129894],"ca":[72855,8688,21088,1341,77301],"rc":[118340,83533,1081003],"p":"p4","bz":0.4010050251256282,"q":0.05025125628140704,"n":16839,"v":7.511,"rt":134,"se":null,"tg":"Une rébellion fondée sur l'espoir.","ov":"Situé entre les épisodes III et IV de la saga Star Wars, le film nous entraîne aux côtés d’individus ordinaires qui, pour rester fidèles à leurs valeurs, vont tenter l’impossible au péril de leur vie. Ils n’avaient pas prévu de devenir des héros, mais dans une époque de plus en plus sombre, ils vont devoir dérober les plans de l’Étoile de la Mort, l’arme de destruction ultime de l’Empire.","po":"/obsGPyNOAwkQbLRQOHR6a21VT23.jpg"},{"m":"movie","i":331482,"t":"Les Filles du docteur March","y":"2019","g":[18,10749],"k":[306,308,310,18,1974,191,3073,3074,394,119,316,332,528,2011,2012],"cr":[45400],"ca":[36592,10990,1373737,1669125,4784],"rc":[],"p":"p4","bz":0.5376884422110553,"q":0.5778894472361809,"n":7036,"v":7.8,"rt":135,"se":null,"tg":"Appropriez-vous votre histoire.","ov":"Aux États-Unis, pendant la guerre de Sécession, 4 sœurs issues de la classe moyenne font face aux difficultés de la vie quotidienne en ce temps de conflit. La raisonnable Mege, l’intrépide Jo, la charitable Beth et l’orgueilleuse May vivent dans l’ombre protectrice et bienveillante de leur mère Marnee et de sa tante March. Mais la rencontre de leur voisin Laurie va transformer les premiers émois du bal des débutantes en véritables histoires d’amour…  Une nouvelle adaptation du classique de Louisa May Alcott.","po":"/A1OAKgItnKEilZkInZxUiKADhmZ.jpg"},{"m":"movie","i":332562,"t":"A Star is Born","y":"2018","g":[10402,18,10749],"k":[3075,519,1006,577,3076,3077,3078,3079,3080,3081,3082,3083,2285,925,3084,631,332,1017,2860,3085,529,3086,2754,3087,3088],"cr":[51329],"ca":[237405,51329,16431,57906,21660],"rc":[],"p":"p4","bz":0.35678391959798994,"q":0.04020100502512563,"n":12429,"v":7.488,"rt":135,"se":null,"tg":null,"ov":"Star de country un peu oubliée, Jackson Maine découvre Ally, une jeune chanteuse très prometteuse. Tandis qu’ils tombent follement amoureux l’un de l’autre, Jack propulse Ally sur le devant de la scène et fait d’elle une artiste adulée par le public. Bientôt éclipsé par le succès de la jeune femme, il vit de plus en plus mal son propre déclin…","po":"/uoq8DobPxciPEJ5EuBeqDt8av76.jpg"},{"m":"movie","i":333339,"t":"Ready Player One","y":"2018","g":[12,28,878],"k":[517,3089,18,908,3090,94,448,3091,1926,1775,3092,22,474,422,3093,3094,3095,1193],"cr":[488],"ca":[1034681,1173984,77335,1059572,51990],"rc":[],"p":"p4","bz":0.5497487437185931,"q":0.19597989949748743,"n":17451,"v":7.585,"rt":140,"se":null,"tg":"Une aventure trop grande pour le monde réel.","ov":"En 2045, le monde est au bord du chaos. Les êtres humains se réfugient dans l'OASIS, univers virtuel mis au point par le brillant et excentrique James Halliday. Avant de disparaître, celui-ci a décidé de léguer son immense fortune à quiconque découvrira l'œuf de Pâques numérique qu'il a pris soin de dissimuler dans l'OASIS. L'appât du gain provoque une compétition planétaire. Mais lorsqu'un jeune garçon, Wade Watts, qui n'a pourtant pas le profil d'un héros, décide de participer à la chasse au trésor, il est plongé dans un monde parallèle à la fois mystérieux et inquiétant…","po":"/832ngDVXhOVp6HBnuMMeeWTrGXN.jpg"},{"m":"movie","i":334533,"t":"Captain Fantastic","y":"2016","g":[18,35],"k":[1058,3096,1347,1183,3097,841,302,3098,3099,2874,473,3100,1615,3101,2320,3102,3103,1936,1097,469,1547,1895,3104,3105,3106,2959],"cr":[11154],"ca":[110,146750,1261400,1024722,1504947],"rc":[],"p":"p4","bz":0.471356783919598,"q":0.6733668341708543,"n":7002,"v":7.887,"rt":118,"se":null,"tg":"Il les a préparés à tout sauf au monde extérieur!","ov":"Dans les forêts reculées du nord-ouest des États-Unis, vivant isolé de la société, un père dévoué a consacré sa vie tout entière à faire de ses six jeunes enfants d’extraordinaires adultes. Mais quand le destin frappe sa famille, ils doivent abandonner ce paradis qu’il avait créé pour eux. La découverte du monde extérieur va l’obliger à questionner ses méthodes d’éducation et remettre en cause tout ce qu’il leur a appris.","po":"/vjl0ZtqhKUWQ9v6tRl2NL4gNaz6.jpg"},{"m":"movie","i":334541,"t":"Manchester by the Sea","y":"2016","g":[18],"k":[3107,2154,301,101,313,3108,3109,2371,695,696,2487,3110,3111,276,394,2555,466,3112,3113,2716,99],"cr":[30711],"ca":[1893,1105079,1812,3497,1363367],"rc":[],"p":"p4","bz":0.278391959798995,"q":0.11055276381909548,"n":6603,"v":7.5,"rt":135,"se":null,"tg":"Le début d'une histoire inoubliable.","ov":"Après le décès soudain de son frère Joe, Lee est désigné comme le tuteur de son neveu Patrick. Il se retrouve confronté à un passé tragique qui l’a séparé de sa femme Randi et de la communauté où il est né et a grandi.","po":"/aiQRRGDU6FcQ3yMYMerqS5GyOnC.jpg"},{"m":"movie","i":334543,"t":"Lion","y":"2016","g":[18],"k":[3114,234,1600,18,8,278,622,1154,2825,3115,2356,3116,1879],"cr":[1173102],"ca":[76788,108916,1371,2227,1717046],"rc":[489999],"p":"p4","bz":0.521608040201005,"q":0.8140703517587939,"n":7092,"v":8.036,"rt":118,"se":null,"tg":"Perdu parmi un milliard d'habitants.","ov":"Une incroyable histoire vraie : À 5 ans, Saroo se retrouve seul dans un train traversant l'Inde qui l'emmène malgré lui à des milliers de kilomètres de sa famille. Perdu, le petit garçon doit apprendre à survivre seul dans l'immense ville de Calcutta.  Après des mois d'errance, il est recueilli dans un orphelinat et adopté par un couple d'Australiens. 25 ans plus tard, Saroo est devenu un véritable Australien, mais il pense toujours à sa famille en Inde. Armé de quelques rares souvenirs et d'une inébranlable détermination, il commence à parcourir des photos satellites sur Google Earth, dans l'espoir de reconnaître son village. Mais peut-on imaginer retrouver une simple famille dans un pays d'un milliard d'habitants ?","po":"/essJCxFQKKg1WtzypMtHFFws88Q.jpg"},{"m":"movie","i":335984,"t":"Blade Runner 2049","y":"2017","g":[878,18],"k":[3089,838,840,3117,702,3118,1148,448,1775,863,3119,803,89,1785,3120,548],"cr":[137 etrouver le plutonium avant qu'il ne soit trop tard…","po":"/6JO3Oz685phBaADyJtf4wmaafYj.jpg"},{"m":"movie","i":354912,"t":"Coco","y":"2017","g":[10751,16,10402,12],"k":[187,1964,3144,2810,3145,61,1543,1419,3146,3147,2811,326,3148,523,497,595,529,475,549],"cr":[8],"ca":[1193391,258,4589,10402,154004],"rc":[228326,438695,508442],"p":"p4","bz":0.9356783919597991,"q":0.9447236180904522,"n":21511,"v":8.199,"rt":110,"se":null,"tg":"La célébration de toute une vie.","ov":"Depuis déjà plusieurs générations, la musique est bannie dans la famille de Miguel. Un vrai déchirement pour le jeune garçon dont le rêve ultime est de devenir un musicien aussi accompli que son idole, Ernesto de la Cruz. Bien décidé à prouver son talent, Miguel, par un étrange concours de circonstances, se retrouve propulsé dans un monde étonnant et coloré lié aux célébrations des ancêtres. Là, il se lie d’amitié avec Hector, un gentil garçon mais un peu filou sur les bords. Ensemble, ils vont accomplir un voyage extraordinaire qui leur révèlera la véritable histoire qui se cache derrière celle de la famille de Miguel…","po":"/sZqcEV3KhDITHlUBmyj1a3RRvT9.jpg"},{"m":"movie","i":359724,"t":"Le Mans 66","y":"2019","g":[18,36,28],"k":[516,18,8,278,3149,2622,939,3150,3151,3152,2623,2106],"cr":[366],"ca":[1892,3894,19498,147056,6164],"rc":[96721,911430],"p":"p4","bz":0.6683417085427137,"q":0.8040201005025126,"n":9363,"v":8.009,"rt":153,"se":null,"tg":"D'après l'histoire vraie de Ford contre Ferrari.","ov":"Relate l’histoire vraie qui a conduit l’ingénieur automobile visionnaire américain Caroll Shelby à faire équipe avec le pilote de course britannique surdoué Ken Miles. Bravant l’ordre établi, défiant les lois de la physique et luttant contre leurs propres démons, les deux hommes n’avaient qu’un seul but : construire pour le compte de Ford Motor Company un bolide révolutionnaire capable de renverser la suprématie de l’écurie d’Enzo Ferrari sur le mythique circuit des 24 heures du Mans en 1966…","po":"/2KQI0x6AEdbiN6z4LWjKZHukMzZ.jpg"},{"m":"movie","i":359940,"t":"3 Billboards : Les Panneaux de la vengeance","y":"2017","g":[80,18],"k":[577,357,2438,2791,3153,3154,3155,395,2930,779,2568,69,740,246,99],"cr":[54472],"ca":[3910,57755,6807,37260,1105079],"rc":[],"p":"p4","bz":0.642211055276382,"q":0.8442211055276382,"n":11250,"v":8.051,"rt":116,"se":null,"tg":"Violée jusqu'à la mort, et toujours pas d’arrestation. Comment se fait-il, chef Willoughby ?","ov":"Après des mois sans que l’enquête sur la mort de sa fille ait avancé, Mildred Hayes prend les choses en main, affichant un message controversé visant le très respecté chef de la police sur trois grands panneaux à l’entrée de leur ville.","po":"/dI6EruCntFCEhnSQSrFdCs9UWVY.jpg"},{"m":"movie","i":361743,"t":"Top Gun : Maverick","y":"2022","g":[28,18],"k":[3156,666,78,3157,3142,89,428,1526],"cr":[86270],"ca":[500,996701,6161,1241330,65717],"rc":[],"p":"p4","bz":0.8100502512562815,"q":0.914572864321608,"n":11684,"v":8.158,"rt":130,"se":null,"tg":"Ressentez le besoin… Le besoin de vitesse.","ov":"Après avoir été l’un des meilleurs pilotes de chasse de l'Aéronavale américaine pendant plus de trente ans, Pete “Maverick\" Mitchell continue à repousser ses limites en tant que pilote d'essai. Il refuse de monter en grade, car cela l’obligerait à renoncer à voler. Il est chargé de former un détachement de jeunes diplômés de l’école Top Gun pour une mission spéciale qu’aucun pilote n'aurait jamais imaginée. Lors de cette mission, Maverick rencontre le lieutenant Bradley “Rooster” Bradshaw, le fils de son défunt ami, le navigateur Nick “Goose” Bradshaw. Face à un avenir incertain, hanté par ses fantômes, Maverick va devoir affronter ses pires cauchemars au cours d’une mission qui exigera les plus grands sacrifices.","po":"/uuwi4wwG6HAHVqaEvJDx6gI773N.jpg"},{"m":"movie","i":372058,"t":"Your Name.","y":"2016","g":[16,10749,18],"k":[1964,443,554,3158,1869,240,1289,2455,1660,3113,3159,814,961,338,1206,2793,105,619,2173,1517],"cr":[74091],"ca":[225730,1369100,1668610,936275,1210634],"rc":[378064],"p":"p4","bz":0.8311557788944723,"q":0.9899497487437185,"n":13077,"v":8.489,"rt":107,"se":null,"tg":"C'était comme une séquence d'un rêve. Ni plus, ni moins qu'une vue absolument sublime.","ov":"Mitsuha est une lycéenne, la fille du maire d'une petite ville nichée entre les montagnes. Vivant avec sa petite sœur et sa grand-mère, c'est une demoiselle franche qui n'hésite pas à dire qu'elle n'a pas envie de participer aux rituels shinto, ou d'aider son père dans ses campagnes électorales. En fait, elle rêve de pouvoir quitter cette ville où elle s'ennuie, pour partir tenter sa chance à la capitale. Taki est un lycéen, un tokyoïte qui travaille à mi-temps dans un restaurant italien, tout en aspirant à des études d'architecture ou dans les Beaux-Arts. Chaque nuit, il fait un rêve étrange, où il devient… une lycéenne campagnarde, vivant dans une petite ville entre les montagnes.  Quel secret se cache derrière ces rêves mutuels, qui unissent ces deux êtres qui ne se sont jamais rencontrés ?","po":"/zyHjvVRgKOt9wgVx4ikp2kGArGF.jpg"},{"m":"movie","i":374720,"t":"Dunkerque","y":"2017","g":[10752,28,18],"k":[869,1519,1520,460,8,3160,3161,3162,2798,3163,324,668,335,78,2683,316,971,3164,3165,597,3166,792,163,877],"cr":[525],"ca":[1687041,2524,40900,11181,2037],"rc":[],"p":"p4","bz":0.42412060301507537,"q":0.010050251256281407,"n":18076,"v":7.45,"rt":106,"se":null,"tg":"L'espoir est une arme. La survie est une victoire.","ov":"Au début de la Seconde Guerre mondiale, en mai 1940, environ 400 000 soldats britanniques, français et belges se retrouvent encerclés par les troupes allemandes dans la poche de Dunkerque. L'Opération Dynamo est mise en place pour évacuer le Corps expéditionnaire britannique (CEB) vers l'Angleterre. L'histoire s'intéresse aux destins croisés des soldats, pilotes, marins et civils anglais durant l'Opération Dynamo. Alors que le CEB est évacué par le port et les plages de Dunkerque, trois soldats britanniques, avec un peu d'ingéniosité et de chance, arrivent à embarquer sous les bombardements. Un périple bien plus grand les attend : la traversée du détroit du Pas de Calais.","po":"/1VOKlC35yrwVKlfBSN52NY4zoF2.jpg"},{"m":"movie","i":375262,"t":"La Favorite","y":"2018","g":[36,35,18],"k":[219,371,3167,3168,3169,3170,2780,153,3171,3172,3173,3174,400,3175],"cr":[122423],"ca":[54693,39187,3293,3292,1496392],"rc":[674324],"p":"p4","bz":0.23216080402010053,"q":0.10050251256281408,"n":6078,"v":7.478,"rt":120,"se":null,"tg":"Leur folle lutte pour le pouvoir commence.","ov":"Début du XVIIIème siècle. L’Angleterre et la France sont en guerre. Toutefois, à la cour, la mode est aux courses de canards et à la dégustation d’ananas. La reine Anne, à la santé fragile et au caractère instable, occupe le trône tandis que son amie Lady Sarah gouverne le pays à sa place. Lorsqu’une nouvelle servante, Abigail Hill, arrive à la cour, Lady Sarah la prend sous son aile, pensant qu’elle pourrait être une alliée. Abigail va y voir l’opportunité de renouer avec ses racines aristocratiques. Alors que les enjeux politiques de la guerre absorbent Sarah, Abigail quant à elle parvient à gagner la confiance de la reine et devient sa nouvelle confidente. Cette amitié naissante donne à la jeune femme l’occasion de satisfaire ses ambitions, et elle ne laissera ni homme, ni femme, ni politique, ni même un lapin se mettre en travers de son chemin.","po":"/bZC5VeHX39PfhsZEcdjD7RHKFSH.jpg"},{"m":"movie","i":378064,"t":"Silent Voice","y":"2016","g":[16,18,10749],"k":[1355,443,1058,236,1197,191,3176,31,240,2455,3177,1206,1297,3127,3178,2354,3179,3180,846],"cr":[1072778],"ca":[19588,221773,936275,1065297,1258549],"rc":[372058],"p":"p4","bz":0.5608040201005026,"q":0.9547738693467337,"n":4722,"v":8.4,"rt":130,"se":null,"tg":null,"ov":"Nishimiya est une élève douce et attentionnée. Chaque jour, elle est harcelée par Ishida, car elle est sourde. Dénoncé pour son comportement, le garçon est à son tour mis à l’écart et renvoyé de l’école… Des années plus tard, il apprend la langue des signes… et part à la recherche de la jeune fille.","po":"/dKKrnbqGvP4GhcZgUyEHBamyA20.jpg"},{"m":"movie","i":381284,"t":"Les Figures de l'ombre","y":"2016","g":[18,36],"k":[516,2572,2179,764,2193,278,2221,1558,2898,3181,465,335,3182,2741,3183,2568,1595,3184,1139,1140],"cr":[1141683],"ca":[40036,6944,1005852,1269,205],"rc":[329865],"p":"p4","bz":0.7025125628140704,"q":0.8391959798994975,"n":10727,"v":8.05,"rt":127,"se":null,"tg":"Elles voulaient changer leur vies, elles ont changé l'Histoire.","ov":"L’histoire de Katherine Johnson, Dorothy Vaughn et Mary Jackson, les cerveaux derrière le premier voyage spatial habité réussi par les Américains en 1962. Ces trois Afro‐Américaines travaillaient pour la NASA et ont permis à l’astronaute John Glenn de réaliser son premier vol en orbite, tout juste 10 mois après le Russe Yuri Gagarine. Cet exploit a redonné confiance à l’Amérique et a relancé la course à l’espace entre les deux grandes puissances politiques de l’époque. Le trio visionnaire a su surpasser les questions raciales et de genre et a jeté les bases du programme spatial qui a abouti à la vision de Kennedy du premier homme sur la Lune.","po":"/A7sbYhUGBYSycTfhj2CV4mz7Fuk.jpg"},{"m":"movie","i":381289,"t":"Mes vies de chien","y":"2017","g":[12,14,10751,18],"k":[18,74,3185,3186,1192],"cr":[5306],"ca":[54415,1680339,52018,928906,7002],"rc":[481848],"p":"p4","bz":0.2633165829145729,"q":0.3869346733668342,"n":3612,"v":7.6,"rt":99,"se":null,"tg":"Chaque chien a sa raison d'être.","ov":"Qui a dit que les animaux n'avaient pas d'âme ? Sûrement pas le petit Ethan, 8 ans, qui en 1962 s'embarque dans une aventure hors du commun en recueillant un chiot nommé Bailey. Au fil des années, Ethan noue des liens très forts avec son chien, présent à chaque étape importante de sa vie. Jusqu'au jour où, dévasté, il doit se résoudre à laisser partir Bailey, âgé et malade. Et si le départ de l'animal n'était en fait qu'un commencement ? Réincarné tour à tour en berger allemand, golden retriever ou labrador, vivant des aventures palpitantes comme chien de sauvetage ou la destinée sereine d’un petit chien de compagnie, Bailey va se découvrir, existence après existence, un but : retrouver son maître Ethan coûte que coûte…","po":"/lXd6nwFyM6BblbkOwy9cTClXumh.jpg"},{"m":"movie","i":381341,"t":"Perfetti sconosciuti","y":"2016","g":[18],"k":[28,3187,31,1986,3188,114,3189,2216,1237,22,2348,3190,1512,3191],"cr":[225160],"ca":[7541,586953,146464,1047948,56843],"rc":[],"p":"p4","bz":0.35678391959798994,"q":0.6331658291457286,"n":4706,"v":7.847,"rt":97,"se":null,"tg":null,"ov":"Chacun de nous a trois vies : une vie publique, une vie privée et une vie secrète. Il fut un temps où notre vie secrète était bien protégée, archivée dans notre mémoire. À présent, elle est dans notre carte SIM, mais qu'arriverait-il si cette dernière se mettait à parler ?","po":"/iiqiAMaBm4S62311XaqpIKuDDX.jpg"},{"m":"movie","i":382591,"t":"Demain tout commence","y":"2016","g":[18,35],"k":[3192,3193,976,3194,1097,353,332,1389,3195,3196],"cr":[1119418],"ca":[78423,1576994,11291,90681,61364],"rc":[],"p":"p4","bz":0.21206030150753769,"q":0.4824120603015075,"n":3080,"v":7.7,"rt":118,"se":null,"tg":null,"ov":"Samuel vit sa vie sans attaches ni responsabilités, au bord de la mer sous le soleil du sud de la France, près des gens qu’il aime et avec qui il travaille sans trop se fatiguer. Jusqu’à ce qu’une de ses anciennes conquêtes lui laisse sur les bras un bébé de quelques mois, Gloria: sa fille! Incapable de s’occuper d’un bébé et bien décidé à rendre l’enfant à sa mère, Samuel se précipite à Londres pour tenter de la retrouver, sans succès. 8 ans plus tard, alors que Samuel et Gloria ont fait leur vie à Londres et sont devenus inséparables, la mère de Gloria revient dans leur vie pour récupérer sa fille…","po":"/1AoQQBmNRgOoavOeUisOPHKPDAF.jpg"},{"m":"movie","i":383498,"t":"Deadpool 2","y":"2018","g":[28,35,12],"k ’immensité sauvage du Wyoming. Lorsqu’il découvre le corps d’une femme en pleine nature, le FBI envoie une jeune recrue élucider ce meurtre. Fortement lié à la communauté amérindienne, il va l’aider à mener l’enquête dans ce milieu hostile, ravagé par la violence et l’isolement, où la loi des hommes s’estompe face à celle impitoyable de la nature…","po":"/yp7ogTlvEvgUIvNXdbfwH68S3i4.jpg"},{"m":"movie","i":396535,"t":"Dernier train pour Busan","y":"2016","g":[28,27,53,12],"k":[3207,970,2028,164,3208,165],"cr":[939147],"ca":[150903,1278162,127720,1024395,1255881],"rc":[1375646,1423191],"p":"p4","bz":0.5577889447236182,"q":0.5829145728643216,"n":8825,"v":7.8,"rt":118,"se":null,"tg":"Pour rester en vie, montez à bord.","ov":"Tandis qu'un virus qui transforme tous les êtres vivants en zombies ravage la Corée du Sud, un père et sa fille tentent de survivre dans le dernier train pour Busan, l'unique ville à n'avoir pas encore été contaminée.","po":"/9FiRluXOwGJZhb1BPSvJYO7SB7y.jpg"},{"m":"movie","i":398818,"t":"Call Me by Your Name","y":"2017","g":[10749,18],"k":[517,18,2232,191,1173,1064,2216,3209,153,22,805,906,3210,1069,2376],"cr":[78160],"ca":[1190668,53807,72873,20577,935096],"rc":[1317672,84892,1516698],"p":"p4","bz":0.7487437185929648,"q":0.8693467336683417,"n":12982,"v":8.078,"rt":131,"se":null,"tg":"Vaut-il mieux parler ou mourir ?","ov":"Été 1983. Elio Perlman, 17 ans, passe ses vacances dans la villa du XVIIe siècle que possède sa famille en Italie, à jouer de la musique classique, à lire et à flirter avec son amie Marzia. Son père, éminent professeur, et sa mère, traductrice, lui ont donné une excellente éducation. Un jour, Oliver, un séduisant Américain qui prépare son doctorat, vient travailler auprès du père d'Elio. Elio et Oliver vont bientôt découvrir l'éveil du désir...","po":"/mLXvHMUiob0fgT4G6RazE6X7SY0.jpg"},{"m":"movie","i":398978,"t":"The Irishman","y":"2019","g":[80,18,36],"k":[1864,516,297,2757,18,2813,323,744,461,302,169,462,1760,1302,3211,3212,32
